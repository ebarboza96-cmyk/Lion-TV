<title>LΛVΛ · Recorrido del test-fit</title>
<style>
:root{
  --char:#141210; --steel:#1f1b18; --steel2:#2a2521; --line:#3a332d;
  --ember:#ff6a1a; --ember2:#ff8c47; --brass:#c9a063; --sage:#6d7a60;
  --bone:#ece5d8; --muted:#9b9185; --paper:#f3efe6;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --bar-h:54px; --rail-h:60px; --r:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;background:var(--char);}
body{overflow:hidden;}
.lava{position:relative;height:100%;display:flex;flex-direction:column;background:var(--char);color:var(--bone);
  font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-tap-highlight-color:transparent;}
.lava *,.lava *::before,.lava *::after{box-sizing:border-box;}
.lava button{font:inherit;color:inherit;}
.lava :focus{outline:none;}
.lava :focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:8px;}
.lava [hidden]{display:none !important;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}

/* ---------- top bar ---------- */
.bar{flex:0 0 var(--bar-h);height:var(--bar-h);display:flex;align-items:center;gap:18px;padding:0 16px;
  background:linear-gradient(180deg,#1b1714,#141210);border-bottom:1px solid #2b2521;position:relative;z-index:30;}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:0 0 auto;}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:.2em;color:var(--bone);
  line-height:1;text-shadow:0 0 18px rgba(255,106,26,.35);padding-left:.06em;}
.tagline{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);white-space:nowrap;}
.tabs{display:flex;gap:4px;background:#0f0d0c;border:1px solid #2d2723;border-radius:999px;padding:3px;margin-left:auto;}
.tab{appearance:none;border:0;background:transparent;padding:7px 15px;border-radius:999px;cursor:pointer;
  font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  transition:background .2s,color .2s;white-space:nowrap;}
.tab:hover{color:var(--bone);}
.tab[aria-selected="true"]{background:var(--ember);color:#1a0e06;}
.meta{font-size:12px;color:var(--muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.meta b{color:var(--bone);font-weight:600;}

main{position:relative;flex:1 1 auto;min-height:0;}
.view{position:absolute;inset:0;overflow:hidden;}

/* ---------- common controls ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;
  border-radius:999px;border:1px solid rgba(236,229,216,.16);background:rgba(20,18,16,.78);color:var(--bone);cursor:pointer;
  font-size:13.5px;font-weight:600;letter-spacing:.01em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background .2s,border-color .2s,color .2s;white-space:nowrap;}
.btn:hover{border-color:rgba(236,229,216,.35);background:rgba(36,31,27,.9);}
.btn[aria-pressed="true"]{background:var(--bone);color:#1a1512;border-color:var(--bone);}
.btn.icon{width:38px;padding:0;font-size:16px;}
.btn.ember{background:var(--ember);color:#1b0d04;border-color:var(--ember);}
.btn.ember:hover{background:var(--ember2);}
.btn svg{width:18px;height:18px;flex:0 0 auto;}
.chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:rgba(20,18,16,.72);
  border:1px solid rgba(236,229,216,.12);font-size:12.5px;color:var(--bone);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--sage);}
.flag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;line-height:1.35;letter-spacing:.02em;color:#ffb68a;
  border:1px solid rgba(255,106,26,.55);background:rgba(255,106,26,.09);border-radius:6px;padding:3px 7px;margin:3px 4px 0 0;}
.flag.tbv{color:#f0d49a;border-color:rgba(201,160,99,.6);background:rgba(201,160,99,.1);}

/* ---------- recorrido ---------- */
.stage{position:absolute;inset:0;touch-action:none;cursor:grab;outline:none;}
.stage.dragging{cursor:grabbing;}
.stage.hovering{cursor:pointer;}
.stage canvas{display:block;width:100%;height:100%;}
.hud-top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:6;}
.hud-top>*{pointer-events:auto;}
.hud-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.where{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layers{position:absolute;right:12px;top:60px;z-index:6;background:rgba(20,18,16,.86);border:1px solid rgba(236,229,216,.14);
  border-radius:var(--r);padding:10px 12px;min-width:210px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.layers h3,.help h3{margin:0 0 6px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer;}
.toggle input{accent-color:var(--ember);width:16px;height:16px;margin:0;}
.legend{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px;color:var(--muted);margin:4px 0 2px 24px;}
.legend svg{width:30px;height:8px;align-self:center;}
.help{position:absolute;right:12px;top:60px;z-index:7;width:min(330px,calc(100% - 24px));background:rgba(20,18,16,.92);
  border:1px solid rgba(236,229,216,.14);border-radius:var(--r);padding:14px 16px;font-size:13px;color:var(--bone);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.help ul{margin:0;padding-left:18px;}
.help li{margin:3px 0;}
.help kbd{font-family:var(--f-mono);font-size:11px;border:1px solid #4a423b;border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--bone);background:#1d1916;}
.card{position:absolute;z-index:8;background:rgba(20,18,16,.9);border:1px solid rgba(236,229,216,.14);border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.caption{left:16px;bottom:calc(var(--rail-h) + var(--safe-b) + 14px);width:min(410px,calc(100% - 32px));padding:14px 16px 12px;
  max-height:calc(100% - var(--rail-h) - 110px);overflow:auto;}
.cap-head{display:flex;align-items:baseline;gap:10px;}
.cap-idx{font-family:var(--f-mono);font-size:11px;color:var(--ember);letter-spacing:.06em;}
.cap-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.07em;text-transform:uppercase;line-height:1.05;}
.cap-text{margin:7px 0 4px;font-size:14px;color:#d9d1c4;}
.cap-nav{display:flex;gap:6px;margin-top:10px;}
.cap-nav .btn{height:32px;font-size:12.5px;padding:0 12px;}
.x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;}
.x:hover{color:var(--bone);background:rgba(255,255,255,.06);}
.info{left:16px;top:60px;width:min(330px,calc(100% - 32px));padding:14px 16px;}
.info .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);}
.info h3{margin:2px 30px 6px 0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;}
.info .dims{font-family:var(--f-mono);font-size:14px;color:var(--bone);}
.info .dims small{color:var(--muted);font-size:11px;}
.info p{margin:6px 0 0;font-size:13px;color:#cfc6b8;}
.minimap{position:absolute;right:16px;bottom:calc(var(--rail-h) + var(--safe-b) + 14px);z-index:6;background:rgba(15,13,12,.84);
  border:1px solid rgba(236,229,216,.14);border-radius:12px;padding:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.minimap canvas{display:block;width:250px;height:180px;cursor:crosshair;touch-action:none;border-radius:8px;}
.minimap .mm-t{position:absolute;left:12px;top:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none;}
.rail{position:absolute;left:0;right:0;bottom:0;height:calc(var(--rail-h) + var(--safe-b));padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:10px;align-items:center;
  background:linear-gradient(0deg,rgba(14,12,11,.95),rgba(14,12,11,.75));border-top:1px solid rgba(236,229,216,.08);z-index:9;}
.stops{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;padding:2px;scroll-behavior:smooth;}
.stops::-webkit-scrollbar{display:none;}
.stop{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 6px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(236,229,216,.14);background:rgba(31,27,24,.9);color:var(--bone);font-size:13px;font-weight:500;white-space:nowrap;}
.stop b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#2d2723;color:var(--brass);font-family:var(--f-mono);font-size:11px;font-weight:500;}
.stop:hover{border-color:rgba(236,229,216,.35);}
.stop[aria-current="true"]{border-color:var(--ember);background:rgba(255,106,26,.14);}
.stop[aria-current="true"] b{background:var(--ember);color:#1b0d04;}
#btn-auto{flex:0 0 auto;}
.joy{position:absolute;left:18px;bottom:calc(var(--rail-h) + var(--safe-b) + 18px);width:118px;height:118px;border-radius:50%;z-index:7;
  background:radial-gradient(circle,rgba(236,229,216,.07),rgba(236,229,216,.02) 70%);border:1px solid rgba(236,229,216,.22);touch-action:none;}
.joy-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(236,229,216,.2);
  border:1px solid rgba(236,229,216,.45);box-shadow:0 4px 14px rgba(0,0,0,.4);}
.joy-label{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.hint{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:6;padding:8px 14px;border-radius:999px;font-size:13px;
  background:rgba(20,18,16,.82);border:1px solid rgba(236,229,216,.14);color:var(--bone);white-space:nowrap;pointer-events:none;transition:opacity .6s;}
.loader{position:absolute;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:16px;background:radial-gradient(ellipse at 50% 60%,#2a1a10 0%,#141210 60%);transition:opacity .7s;}
.loader-mark{font-family:var(--f-display);font-weight:800;font-size:64px;letter-spacing:.24em;padding-left:.24em;color:var(--bone);text-shadow:0 0 34px rgba(255,106,26,.55);}
.loader-bar{width:200px;height:3px;border-radius:3px;background:#2c2521;overflow:hidden;}
.loader-bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,var(--ember),#ffc27a);transition:width .3s;}
.loader p{margin:0;font-size:13px;color:var(--muted);letter-spacing:.04em;}
.fail{position:absolute;inset:0;z-index:21;display:grid;place-content:center;padding:24px;background:var(--char);text-align:center;}
.fail h2{font-family:var(--f-display);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px;font-size:26px;}
.fail p{max-width:460px;margin:0 auto 16px;color:#cfc6b8;}
.fail .row{display:flex;gap:10px;justify-content:center;}

/* ---------- plano ---------- */
#view-plano{background:#191613;}
.plan-wrap{position:absolute;inset:0;touch-action:none;cursor:grab;}
.plan-wrap.dragging{cursor:grabbing;}
.plan-wrap svg.plan-root{display:block;width:100%;height:100%;}
.plan-tools{position:absolute;right:12px;top:12px;display:flex;gap:8px;z-index:3;flex-wrap:wrap;justify-content:flex-end;}
.plan-legend{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(20,18,16,.9);border:1px solid rgba(236,229,216,.14);border-radius:12px;
  padding:10px 12px;font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;max-width:calc(100% - 24px);}
.plan-legend h3{grid-column:1/-1;margin:0 0 2px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);}
.sw{width:22px;height:12px;border-radius:3px;align-self:center;}
.plan-note{position:absolute;left:12px;top:12px;z-index:3;}

/* ---------- datos ---------- */
#view-datos{overflow:auto;-webkit-overflow-scrolling:touch;}
.datos{max-width:1080px;margin:0 auto;padding:22px 16px 60px;}
.datos h2{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;}
.datos h3{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:28px 0 10px;}
.datos .lead{color:var(--muted);margin:0 0 6px;max-width:760px;}
.note{border:1px dashed rgba(201,160,99,.5);background:rgba(201,160,99,.07);border-radius:10px;padding:10px 12px;color:#e2d3b5;font-size:13px;margin:14px 0 0;}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;}
.kpi{background:var(--steel);border:1px solid #2d2723;border-radius:12px;padding:12px 14px;}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;color:var(--bone);line-height:1.2;}
.kpi .v small{font-size:13px;color:var(--muted);margin-left:3px;}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px;}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--steel);border-radius:12px;overflow:hidden;}
.tbl th,.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid #2c2622;vertical-align:top;}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:#1a1714;}
.tbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.tbl tr:last-child td{border-bottom:0;}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid #2d2723;}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.list li{background:var(--steel);border:1px solid #2d2723;border-radius:10px;padding:10px 12px;font-size:13.5px;}
.list li .t{color:var(--bone);}
.list li .s{color:var(--muted);font-size:12.5px;margin-top:2px;}
.ok{color:#8fcf8f;} .bad{color:#ff8a6a;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.cols>div{min-width:0;}

/* ---------- responsive ---------- */
.only-phone{display:none !important;}
@media (max-width:760px){
  :root{--bar-h:50px;--rail-h:56px;}
  .bar{gap:10px;padding:0 10px;}
  .wordmark{font-size:22px;}
  .tagline{display:none;}
  .meta{display:none;}
  .tab{padding:7px 11px;font-size:14px;}
  .cols{grid-template-columns:1fr;}
  .only-phone{display:inline-flex !important;}
  .minimap{right:10px;bottom:calc(var(--rail-h) + var(--safe-b) + 10px);}
  .minimap.collapsed{display:none;}
  .minimap canvas{width:196px;height:150px;}
  .caption{left:8px;right:8px;width:auto;top:56px;bottom:auto;padding:11px 13px 9px;max-height:44%;}
  .cap-nav{margin-top:8px;}
  .layers{left:8px;right:auto;top:auto;bottom:calc(var(--rail-h) + var(--safe-b) + 10px);min-width:0;}
  .plan-note{display:none;}
  .cap-title{font-size:19px;}
  .cap-text{font-size:13px;line-height:1.4;margin:5px 0 2px;}
  .info{left:8px;right:8px;width:auto;top:56px;}
  .btn{height:36px;font-size:13px;padding:0 12px;}
  .btn.icon{width:36px;}
  .rail{gap:8px;padding-left:8px;padding-right:8px;}
  .stop{height:36px;font-size:12.5px;}
  .long{display:none;}
  .hint{top:auto;bottom:calc(var(--rail-h) + var(--safe-b) + 150px);white-space:normal;width:max-content;max-width:calc(100% - 32px);text-align:center;}
  .datos h2{font-size:25px;}
  .kpi .v{font-size:21px;}
}
@media (max-width:380px){ .tab{padding:6px 9px;font-size:13px;} .wordmark{font-size:20px;letter-spacing:.16em;} }
@media (prefers-reduced-motion:reduce){ .lava *{transition:none !important;scroll-behavior:auto !important;} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<div id="lava-app" class="lava">
  <header class="bar">
    <div class="brand"><span class="wordmark" role="img" aria-label="LAVA">LΛVΛ</span><span class="tagline">Contemporary Fire &amp; BBQ</span></div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" id="tab-recorrido" aria-controls="view-recorrido" data-view="recorrido" aria-selected="true">Recorrido<span class="long"> 3D</span></button>
      <button class="tab" role="tab" id="tab-plano" aria-controls="view-plano" data-view="plano" aria-selected="false" tabindex="-1">Plano</button>
      <button class="tab" role="tab" id="tab-datos" aria-controls="view-datos" data-view="datos" aria-selected="false" tabindex="-1">Datos</button>
    </nav>
    <div class="meta" id="meta"></div>
  </header>
  <main>
    <section id="view-recorrido" class="view" role="tabpanel" aria-labelledby="tab-recorrido">
      <div id="stage" class="stage" tabindex="0" role="application" aria-label="Recorrido 3D del restaurante. W A S D o flechas para caminar; arrastra para mirar; toca el piso para caminar hasta ahí; toca un equipo para ver sus medidas."></div>
      <div id="loader" class="loader" aria-live="polite"><div class="loader-mark" aria-hidden="true">LΛVΛ</div><div class="loader-bar"><i id="loader-fill"></i></div><p id="loader-msg">Encendiendo la parrilla…</p></div>
      <div id="fail3d" class="fail" hidden role="alert">
        <div>
          <h2>Recorrido 3D no disponible</h2>
          <p id="fail-msg">Este navegador no puede mostrar gráficos 3D (WebGL).</p>
          <div class="row"><a class="btn ember" href="#plano">Ver plano</a><a class="btn" href="#datos">Ver datos</a></div>
        </div>
      </div>
      <div class="hud-top">
        <div id="where" class="chip where" aria-live="polite"><i></i><span>Entrada</span></div>
        <div class="hud-actions">
          <button id="btn-aerial" class="btn" type="button" aria-pressed="false" title="Vista aérea (V)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Vista aérea</button>
          <button id="btn-map" class="btn icon only-phone" type="button" aria-label="Mostrar u ocultar minimapa" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg></button>
          <button id="btn-help" class="btn icon" type="button" aria-label="Ayuda de controles" aria-expanded="false" aria-controls="help">?</button>
        </div>
      </div>
      <div id="layers" class="layers" hidden>
        <h3>Capas</h3>
        <label class="toggle"><input type="checkbox" id="tg-zones" checked> Zonas A–E</label>
        <label class="toggle"><input type="checkbox" id="tg-routes" checked> Rutas</label>
        <div class="legend" id="route-legend"></div>
      </div>
      <div id="help" class="help" hidden>
        <h3>Cómo moverse</h3>
        <ul id="help-list"></ul>
      </div>
      <div id="hint" class="hint" hidden></div>
      <div id="info" class="card info" hidden role="dialog" aria-labelledby="info-title">
        <button class="x" type="button" id="info-x" aria-label="Cerrar ficha">×</button>
        <div class="k" id="info-k"></div>
        <h3 id="info-title"></h3>
        <div class="dims" id="info-dims"></div>
        <div id="info-flags"></div>
        <p id="info-note"></p>
      </div>
      <div id="caption" class="card caption" hidden aria-live="polite">

/* ===================================================================================
   01 model: everything derived from existing.json + layout.json (no three.js).
   Walls/openings/regions/walk-grid/pathfinding, decor placement, tour stops, metrics.

const DOOR_TYPES = new Set(['door', 'double_acting_door', 'sliding_door', 'service_door', 'opening']);
const HOT_KEYS = ['parrilla', 'cocina_4q', 'plancha', 'freidora_1', 'freidora_2'];
const FOH_NAME = /sal[oó]n|comedor|dining|barra|\bbar\b|caja|entrada|recep|clientes|foh/i;

const MODEL = buildModel();

function buildModel() {
  const M = { warnings: [] };
  M.ceilH = clamp(num(EX.ceiling && EX.ceiling.height_assumed, 3.0), 2.4, 6);
  M.meta = (LAY.meta && typeof LAY.meta === 'object') ? LAY.meta : {};

  /* ---------- premises ---------- */
  let prem = arr(EX.premises_polygon).map(pt).filter(Boolean);
  if (prem.length < 3) {
    const rs = arr(EX.walls).map(w => nrect(w && w.rect)).filter(Boolean);
    const bb = rs.length ? [Math.min(...rs.map(r => r[0])), Math.min(...rs.map(r => r[1])), Math.max(...rs.map(r => r[2])), Math.max(...rs.map(r => r[3]))] : [0, 0, 10, 5];
    prem = [[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]]];
    M.warnings.push('Sin premises_polygon: se usa el rectángulo envolvente de los muros.');
  }
  M.prem = prem;
  M.pbb = polyBBox(prem);
  M.premArea = polyArea(prem);
  M.segs = prem.map((p, i) => { const q = prem[(i + 1) % prem.length]; return [p[0], p[1], q[0], q[1]]; });

  /* ---------- existing context ---------- */
  M.columns = arr(EX.columns).map(c => ({ id: str(c && c.id), rect: nrect(c && c.rect), note: str(c && c.note) })).filter(c => c.rect);
  M.shafts = arr(EX.shafts).map(s => ({ id: str(s && s.id), rect: nrect(s && s.rect), note: str(s && s.note) })).filter(s => s.rect);
  M.glazing = arr(EX.glazing).map(g => ({ id: str(g && g.id), kind: str(g && g.kind, 'window'), rect: nrect(g && g.rect), note: str(g && g.note) })).filter(g => g.rect);
  M.stair = EX.stair && nrect(EX.stair.outline) ? { rect: nrect(EX.stair.outline), flights: arr(EX.stair.flights).map(nrect).filter(Boolean) } : null;
  M.doors = arr(EX.doors).filter(d => d && d.kind !== 'context' && Array.isArray(d.opening) && d.opening.length >= 4).map(d => {
    const o = d.opening.map(Number);
    return { id: str(d.id), kind: str(d.kind), a: [o[0], o[1]], b: [o[2], o[3]], width: num(d.width, Math.hypot(o[2] - o[0], o[3] - o[1])), note: str(d.note) };
  }).filter(d => d.a.every(isFinite) && d.b.every(isFinite));
  M.keepouts = arr(EX.keepouts).map(k => ({ id: str(k && k.id), rect: nrect(k && k.rect), note: str(k && k.note) })).filter(k => k.rect);

  /* ---------- demolitions / openings / walls ---------- */
  const dem = arr(LAY.demolish).filter(d => d && typeof d === 'object');
  const gone = new Set(dem.filter(d => typeof d.id === 'string' && !nrect(d.rect)).map(d => d.id));
  const partial = dem.map(d => nrect(d.rect)).filter(Boolean);
  M.openings = arr(LAY.new_openings).filter(o => o && typeof o === 'object').map((o, i) => ({
    id: str(o.id, 'OP' + (i + 1)), type: str(o.type, 'opening'), rect: nrect(o.rect), label: str(o.label), width: num(o.width, null),
    hinge: pt(o.hinge), closed_to: pt(o.closed_to), swing_to: pt(o.swing_to), conditional: !!o.conditional, note: str(o.note),
  })).filter(o => o.rect);
  const doorOps = M.openings.filter(o => DOOR_TYPES.has(o.type));
  const passOps = M.openings.filter(o => o.type === 'pass_window');

  M.demolished = [];
  M.walls = [];        // standing wall pieces (door openings cut) {id, rect, src, kind, type, h, role}
  M.wallsSolid = [];   // same but with door openings closed (for region classification)
  for (const w of arr(EX.walls)) {
    const r = nrect(w && w.rect); if (!r) continue;
    if (gone.has(w.id)) { M.demolished.push({ id: str(w.id), rect: r }); continue; }
    let pieces = [r];
    for (const p of partial) {
      const i = rInter(r, p); if (i) M.demolished.push({ id: str(w.id), rect: i });
      pieces = pieces.flatMap(q => rSub(q, p));
    }
    for (const q of pieces) M.wallsSolid.push(q);
    for (const o of doorOps) pieces = pieces.flatMap(q => rSub(q, o.rect));
    for (const q of pieces) M.walls.push({ id: str(w.id), rect: q, src: 'existing', kind: str(w.kind, 'wall'), type: 'existing', h: M.ceilH });
  }
  M.newWalls = arr(LAY.new_walls).filter(w => w && typeof w === 'object').map((w, i) => ({
    id: str(w.id, 'NW' + (i + 1)), rect: nrect(w.rect), type: str(w.type, 'partition'), role: str(w.role),
    h: clamp(num(w.h, M.ceilH), 0.3, M.ceilH), base_h: clamp(num(w.base_h, 1.0), 0.2, 1.4), note: str(w.note),
  })).filter(w => w.rect);
  for (const w of M.newWalls) {
    M.wallsSolid.push(w.rect);
    let pieces = [w.rect];
    for (const o of doorOps) pieces = pieces.flatMap(q => rSub(q, o.rect));
    for (const q of pieces) M.walls.push({ id: w.id, rect: q, src: 'new', kind: 'new', type: w.type, h: w.h, base_h: w.base_h, role: w.role, parent: w });
  }
  for (const o of doorOps) M.wallsSolid.push(o.rect);

  /* ---------- program ---------- */
  M.equip = arr(LAY.equipment).filter(e => e && typeof e === 'object').map((e, i) => {
    const r = nrect(e.rect); if (!r) return null;
    const key = str(e.key);
    return { id: str(e.id, 'EQ' + (i + 1)), key, label: str(e.label) || KEY_ES[key] || key || 'Equipo', cat: str(e.cat, 'misc'),
      rect: r, h: clamp(num(e.h, 0.9), 0.02, M.ceilH), front: normDir(e.front), clear: Math.max(0, num(e.clear, 0)), tbv: !!e.tbv,
      overhead: !!e.overhead || key === 'hood', stack: str(e.stack_with), note: str(e.note), baffle: !!e.baffle };
  }).filter(Boolean);
  M.byKey = k => M.equip.filter(e => e.key === k);
  M.one = k => M.equip.find(e => e.key === k) || null;
  M.tables = arr(LAY.tables).filter(t => t && typeof t === 'object').map((t, i) => ({ id: str(t.id, 'T' + (i + 1)), rect: nrect(t.rect),
    seats: Math.max(0, Math.round(num(t.seats, 2))), type: str(t.type), join: arr(t.joinable_with).map(String) })).filter(t => t.rect);
  M.chairs = arr(LAY.chairs).filter(c => c && typeof c === 'object').map((c, i) => ({ id: str(c.id, 'CH' + (i + 1)), rect: nrect(c.rect),
    table: str(c.table), facing: normDir(c.facing) })).filter(c => c.rect);
  M.banquettes = arr(LAY.banquettes).filter(b => b && typeof b === 'object').map((b, i) => ({ id: str(b.id, 'BQ' + (i + 1)), rect: nrect(b.rect),
    seats: Math.max(0, Math.round(num(b.seats, 0))), back: normDir(b.back) })).filter(b => b.rect);
  M.zones = arr(LAY.zones).filter(z => z && typeof z === 'object').map((z, i) => {
    const poly = arr(z.poly).map(pt).filter(Boolean); if (poly.length < 3) return null;
    const color = /^#[0-9a-f]{3,8}$/i.test(str(z.color)) ? z.color : ZONE_FALLBACK_COLORS[i % ZONE_FALLBACK_COLORS.length];
    return { id: str(z.id, String.fromCharCode(65 + i)), name: str(z.name), poly, color, prep: !!z.prep, area: polyArea(poly), c: polyCentroid(poly) };
  }).filter(Boolean);
  M.routes = arr(LAY.routes).filter(r => r && typeof r === 'object').map((r, i) => {
    const pts = arr(r.pts).map(pt).filter(Boolean); if (pts.length < 2) return null;
    let len = 0; for (let k = 1; k < pts.length; k++) len += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
    return { id: str(r.id, 'R' + (i + 1)), kind: str(r.kind, 'guest'), label: str(r.label), pts, min_width: num(r.min_width, null), len };
  }).filter(Boolean);
  M.points = {};
  if (LAY.points && typeof LAY.points === 'object') for (const [k, v] of Object.entries(LAY.points)) { const p = pt(v); if (p) M.points[k] = p; }
  M.seats = M.chairs.length + M.banquettes.reduce((s, b) => s + b.seats, 0);

  M.partition = M.newWalls.find(w => w.role === 'kitchen_dining_partition') || M.newWalls.find(w => w.type === 'glass_partition') || null;

  /* ---------- colliders (continuous 2D collision) ---------- */
  const furn = [...M.tables.map(t => t.rect), ...M.banquettes.map(b => b.rect)];
  const eqBlock = M.equip.filter(e => !e.overhead).map(e => e.rect);
  M.colliders = [...M.walls.map(w => w.rect), ...M.columns.map(c => c.rect), ...M.glazing.map(g => g.rect), ...M.shafts.map(s => s.rect),
    ...(M.stair ? [M.stair.rect] : []), ...eqBlock, ...furn];
  M.barriers = [...M.wallsSolid.map(r => ({ r, k: 'wall' })), ...M.columns.map(c => ({ r: c.rect, k: 'column' })), ...M.glazing.map(g => ({ r: g.rect, k: 'glass' }))];

  /* ---------- entrance ---------- */
  const dEnt = M.doors.find(d => d.id === 'D-ENT') || M.doors.find(d => d.kind === 'double') || null;
  M.entranceDoor = dEnt;
  let ent = M.points.entrance || null;
  if (!ent && dEnt) {
    const cx = (dEnt.a[0] + dEnt.b[0]) / 2, cy = (dEnt.a[1] + dEnt.b[1]) / 2;
    const nx = -(dEnt.b[1] - dEnt.a[1]), ny = dEnt.b[0] - dEnt.a[0], L = Math.hypot(nx, ny) || 1;
    for (const s of [0.6, -0.6]) { const x = cx + nx / L * s, y = cy + ny / L * s; if (inPoly(x, y, prem)) { ent = [x, y]; break; } }
  }
  if (!ent) ent = [M.pbb[2] - 0.6, (M.pbb[1] + M.pbb[3]) / 2];
  M.entrance = ent;

  buildGrid(M);
  classifyRegions(M);
  M.partInfo = partitionInfo(M);
  M.decor = resolveDecor(M);
  for (const d of M.decor) if (d.collide) M.colliders.push(d.collide);
  M.stops = buildStops(M);
  M.metrics = computeMetrics(M);
  return M;
}

/* ============================ grid ============================ */
function buildGrid(M) {
  const cell = 0.05, bb = rgrow(M.pbb, 0.15);
  const nx = Math.max(4, Math.ceil((bb[2] - bb[0]) / cell)), ny = Math.max(4, Math.ceil((bb[3] - bb[1]) / cell));
  const G = { x0: bb[0], y0: bb[1], cell, nx, ny, n: nx * ny };
  G.ix = x => Math.floor((x - G.x0) / cell);
  G.iy = y => Math.floor((y - G.y0) / cell);
  G.cx = i => G.x0 + (i + 0.5) * cell;
  G.cy = j => G.y0 + (j + 0.5) * cell;
  G.ok = (i, j) => i >= 0 && j >= 0 && i < nx && j < ny;
  const inside = new Uint8Array(G.n);
  for (let j = 0; j < ny; j++) {           // scanline fill of the premises polygon
    const y = G.cy(j), xs = [];
    for (const s of M.segs) { const [ax, ay, bx, by] = s; if ((ay > y) !== (by > y)) xs.push(ax + (y - ay) * (bx - ax) / (by - ay)); }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {

    }
  }
  const paint = (mask, r) => {   // cells overlapping rect
    const i0 = Math.max(0, Math.floor((r[0] - G.x0) / cell)), i1 = Math.min(nx - 1, Math.ceil((r[2] - G.x0) / cell) - 1);
    const j0 = Math.max(0, Math.floor((r[1] - G.y0) / cell)), j1 = Math.min(ny - 1, Math.ceil((r[3] - G.y0) / cell) - 1);

  };

  for (const c of M.columns) paint(solid, c.rect);
  for (const g of M.glazing) paint(solid, g.rect);

  // clearance field: distance (m) from each free cell to nearest blocked/outside cell
  const free = new Uint8Array(G.n);
  for (let k = 0; k < G.n; k++) free[k] = inside[k] && !block[k] ? 1 : 0;
  const d2 = edt2(free, nx, ny);
  const clr = new Float32Array(G.n);
  for (let k = 0; k < G.n; k++) clr[k] = free[k] ? Math.max(0, Math.sqrt(d2[k]) * cell - cell / 2) : 0;
  G.free = free; G.clr = clr;
  M.grid = G;
  M.walkR = 0.24;
  M.clearanceAt = (x, y) => { const i = G.ix(x), j = G.iy(y); return G.ok(i, j) ? clr[j * nx + i] : 0; };
  M.isWalk = (x, y, r = M.walkR) => M.clearanceAt(x, y) >= r;

      for (let dj = -rad; dj <= rad; dj++) for (let di = -rad; di <= rad; di++) {
        if (Math.max(Math.abs(di), Math.abs(dj)) !== rad) continue;
        const i = i0 + di, j = j0 + dj; if (!G.ok(i, j)) continue;

    const L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / (cell * 0.7)));
    for (let k = 0; k <= n; k++) { const t = k / n; if (!M.isWalk(lerp(a[0], b[0], t), lerp(a[1], b[1], t), r)) return false; }
    return true;
  };

    const L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / (cell * 0.7)));
    for (let k = 1; k < n; k++) {
      const t = k / n, x = lerp(a[0], b[0], t), y = lerp(a[1], b[1], t);
      if (ignore && x >= ignore[0] && x <= ignore[2] && y >= ignore[1] && y <= ignore[3]) continue;

  };

}

function edt2(free, nx, ny) {
  const INF = 1e20, n = Math.max(nx, ny);

  const out = new Float32Array(nx * ny);
  const pass = len => {
    let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
    for (let q = 1; q < len; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    k = 0;
    for (let q = 0; q < len; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
  };
  for (let i = 0; i < nx; i++) { for (let j = 0; j < ny; j++) f[j] = free[j * nx + i] ? INF : 0; pass(ny); for (let j = 0; j < ny; j++) out[j * nx + i] = d[j]; }

  return out;
}

function findPath(M, a, b, r) {
  const G = M.grid, nx = G.nx;

  if (!sa || !sb) return null;
  const s = G.iy(sa[1]) * nx + G.ix(sa[0]), t = G.iy(sb[1]) * nx + G.ix(sb[0]);

  const pop = () => { const top = heap[0]; const lk = heap.pop(), lf = hf.pop(); if (heap.length) { heap[0] = lk; hf[0] = lf; let i = 0; for (;;) { const l = 2 * i + 1, rr = l + 1; let m = i; if (l < heap.length && hf[l] < hf[m]) m = l; if (rr < heap.length && hf[rr] < hf[m]) m = rr; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; [hf[m], hf[i]] = [hf[i], hf[m]]; i = m; } } return top; };

  g[s] = 0; push(s, hfun(s));

  let found = false, iter = 0;

      const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= nx || jj >= G.ny) continue;
      const kk = jj * nx + ii; if (closed[kk] || !walk(kk)) continue;

      const ng = g[k] + c * (1 + 0.6 / (1 + 12 * G.clr[kk]));

}

/* ============================ regions ============================ */
function classifyRegions(M) {
  const G = M.grid, nx = G.nx, region = new Uint8Array(G.n);   // 0 out, 1 FOH, 2 BOH
  let insideCount = 0; for (let k = 0; k < G.n; k++) if (G.inside[k]) { region[k] = 2; insideCount++; }

    const k = j * nx + i; if (!open(k)) continue; const d = (i - ei) ** 2 + (j - ej) ** 2; if (d < bd) { bd = d; seed = k; }
  }

        if (!seen[kk] && open(kk)) { seen[kk] = 1; q.push(kk); }
      }
    }
  }
  M.regionMode = 'flood';
  if (seed < 0 || fohCount > 0.85 * insideCount || fohCount < 0.05 * insideCount) {
    // leaked (kitchen open to dining) -> use zones: zones holding tables or named like dining are FOH
    M.regionMode = 'zones';
    const fohZones = M.zones.filter(z => FOH_NAME.test(z.name) || M.tables.some(t => inPoly(rcx(t.rect), rcy(t.rect), z.poly)));
    const bohZones = M.zones.filter(z => !fohZones.includes(z));
    for (let k = 0; k < G.n; k++) {
      if (!G.inside[k]) continue;
      const x = G.cx(k % nx), y = G.cy((k / nx) | 0);
      region[k] = bohZones.some(z => inPoly(x, y, z.poly)) ? 2 : 1;
    }
    if (!M.zones.length) M.regionMode = 'none';
  }

  M.regionAt = (x, y) => { const i = G.ix(x), j = G.iy(y); return G.ok(i, j) ? region[j * nx + i] : 0; };

  for (let k = 0; k < G.n; k++) if (region[k] === 1) { const x = G.cx(k % nx), y = G.cy((k / nx) | 0); b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)]; cnt++; }

  M.fohArea = cnt * G.cell * G.cell;

  M.dining = din.length ? [Math.min(...din.map(r => r[0])), Math.min(...din.map(r => r[1])), Math.max(...din.map(r => r[2])), Math.max(...din.map(r => r[3]))] : M.fohBB;

}

function greedyRects(G, pred) {
  const nx = G.nx, used = new Uint8Array(G.n), out = [];
  for (let j = 0; j < G.ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i; if (used[k] || !pred(k)) continue;
    let w = 1; while (i + w < nx && !used[k + w] && pred(k + w)) w++;
    let h = 1;
    outer: while (j + h < G.ny) { for (let d = 0; d < w; d++) { const kk = (j + h) * nx + i + d; if (used[kk] || !pred(kk)) break outer; } h++; }
    for (let dj = 0; dj < h; dj++) for (let d = 0; d < w; d++) used[(j + dj) * nx + i + d] = 1;
    out.push([G.x0 + i * G.cell, G.y0 + j * G.cell, G.x0 + (i + w) * G.cell, G.y0 + (j + h) * G.cell]);

}

/* ray against wall barriers (+ premises edges); returns {t, k} */
function castRay(M, x, y, dx, dy, maxT = 40, kinds) {

  for (const s of M.segs) { const t = raySeg(x, y, dx, dy, s[0], s[1], s[2], s[3]); if (t >= 0 && t < best) { best = t; k = 'edge'; } }

/* side of a rect that faces the open room */
function openFace(M, r) {
  const cands = rw(r) >= rh(r) ? ['N', 'S'] : ['E', 'W'];
  let best = cands[0], bt = -1;
  for (const f of cands) {
    const [dx, dy] = DIRV[f];
    const ox = rcx(r) + dx * (rw(r) / 2 + 0.02), oy = rcy(r) + dy * (rh(r) / 2 + 0.02);
    const t = M.isInside(ox, oy) ? castRay(M, ox, oy, dx, dy, 20).t : -1;
    if (t > bt) { bt = t; best = f; }
  }
  return best;

/* front of equipment: data, else the side with most free space */
function itemFront(M, e) {
  if (e.front) return e.front;
  let best = 'S', bt = -1;
  for (const f of ['N', 'S', 'E', 'W']) {
    const [dx, dy] = DIRV[f];
    const ox = rcx(e.rect) + dx * (rw(e.rect) / 2 + 0.02), oy = rcy(e.rect) + dy * (rh(e.rect) / 2 + 0.02);
    if (!M.isInside(ox, oy)) continue;
    const t = castRay(M, ox, oy, dx, dy, 20).t;
    if (t > bt) { bt = t; best = f; }
  }
  return best;
}

/* ============================ partition ============================ */
function partitionInfo(M) {
  const P = M.partition; if (!P) return null;
  const r = P.rect, along = rh(r) >= rw(r) ? 'y' : 'x';
  // which face is the dining side?
  const probe = f => { const [dx, dy] = DIRV[f]; const x = rcx(r) + dx * (Math.min(rw(r), rh(r)) / 2 + 0.3), y = rcy(r) + dy * (Math.min(rw(r), rh(r)) / 2 + 0.3); return M.regionAt(x, y); };
  const faces = along === 'y' ? ['E', 'W'] : ['N', 'S'];
  let face = faces.find(f => probe(f) === 1);
  if (!face) { const d0 = Math.hypot(rcx(r) + DIRV[faces[0]][0] - M.entrance[0], rcy(r) + DIRV[faces[0]][1] - M.entrance[1]), d1 = Math.hypot(rcx(r) + DIRV[faces[1]][0] - M.entrance[0], rcy(r) + DIRV[faces[1]][1] - M.entrance[1]); face = d0 < d1 ? faces[0] : faces[1]; }
  const a0 = along === 'y' ? r[1] : r[0], a1 = along === 'y' ? r[3] : r[2];
  const iv = o => { const i = rInter(rgrow(r, 0.02), o.rect); return i ? (along === 'y' ? [i[1], i[3]] : [i[0], i[2]]) : null; };
  const doors = M.openings.filter(o => DOOR_TYPES.has(o.type)).map(iv).filter(Boolean);
  let passes = M.openings.filter(o => o.type === 'pass_window').map(iv).filter(Boolean);

  let implicitPass = false;
  if (!passes.length && P.type === 'glass_partition') {
    const ps = M.byKey('pass').find(e => rDist(e.rect, r) < 0.3);
    if (ps) {
      const pa = along === 'y' ? [ps.rect[1], ps.rect[3]] : [ps.rect[0], ps.rect[2]];
      const sp = spans.map(s => [Math.max(s[0], pa[0]), Math.min(s[1], pa[1])]).filter(s => s[1] - s[0] > 0.6).sort((p, q) => (q[1] - q[0]) - (p[1] - p[0]))[0];
      if (sp) { const c = (sp[0] + sp[1]) / 2, L = Math.min(1.6, sp[1] - sp[0] - 0.2); passes = [[c - L / 2, c + L / 2]]; implicitPass = true; }
    }

    t0: along === 'y' ? r[0] : r[1], t1: along === 'y' ? r[2] : r[3] };
}

/* ============================ decor ============================ */
const DECOR_TYPES = ['slat_wall', 'sign', 'poster', 'sconce', 'pendant', 'planter', 'firewood_niche'];
function resolveDecor(M) {
  const out = [];
  for (const d of arr(LAY.decor)) {
    if (!d || typeof d !== 'object' || !DECOR_TYPES.includes(d.type)) continue;
    let r = nrect(d.rect);
    const p = pt(d.pos);
    if (!r && p) r = [p[0] - 0.05, p[1] - 0.05, p[0] + 0.05, p[1] + 0.05];
    if (!r) continue;
    out.push({ type: d.type, rect: r, face: normDir(d.face) || normDir(d.facing) || openFace(M, r), text: str(d.text), h: num(d.h, null),
      z: num(d.z, null), size: num(d.size, null), style: str(d.style), text_at: num(d.text_at, null), src: 'layout' });
  }
  if (LAY.decor_defaults === false) return out;
  const has = t => out.some(d => d.type === t);
  try { autoDecor(M, out, has); } catch (e) { console.warn('LAVA: decor automático incompleto', e); }
  return out;
}

function wallRuns(M, side, a0, a1, mid) {
  // axis x only for dining long axis along x; generalised by swapping when axis is y
  const ax = M.diningAxis, runs = []; let cur = null;
  for (let a = a0; a <= a1 + 1e-6; a += 0.1) {
    const x = ax === 'x' ? a : mid, y = ax === 'x' ? mid : a;
    const dx = ax === 'x' ? 0 : side, dy = ax === 'x' ? side : 0;
    const h = castRay(M, x, y, dx, dy, 12);
    const face = (ax === 'x' ? y : x) + side * h.t;
    const ok = h.k === 'wall' || h.k === 'edge';
    if (ok && cur && Math.abs(face - cur.face) < 0.03) { cur.a1 = a; }
    else { if (cur) runs.push(cur); cur = ok ? { a0: a, a1: a, face } : null; }
  }
  if (cur) runs.push(cur);
  return runs.map(r => ({ a0: r.a0 - 0.05, a1: r.a1 + 0.05, face: r.face })).filter(r => r.a1 - r.a0 > 0.8);
}

function autoDecor(M, out, has) {
  const D = M.dining, F = M.fohBB, ax = M.diningAxis;
  const midPerp = ax === 'x' ? rcy(D) : rcx(D);
  const lo = (ax === 'x' ? F[0] : F[1]) + 0.1, hi = (ax === 'x' ? F[2] : F[3]) - 0.1;
  const entA = ax === 'x' ? M.entrance[0] : M.entrance[1];
  const entAtHigh = Math.abs(entA - hi) < Math.abs(entA - lo);
  const mk = (a0, a1, p0, p1) => ax === 'x' ? [a0, Math.min(p0, p1), a1, Math.max(p0, p1)] : [Math.min(p0, p1), a0, Math.max(p0, p1), a1];
  const faceDir = side => ax === 'x' ? (side > 0 ? 'N' : 'S') : (side > 0 ? 'W' : 'E');   // decor on wall at +side faces back (-side)
  const tall = M.equip.filter(e => !e.overhead && e.h > 1.2);
  const runsA = wallRuns(M, +1, lo, hi, midPerp);   // "south" (render left) – slat wall

  const slatRun = runsA.slice().sort((p, q) => (q.a1 - q.a0) - (p.a1 - p.a0))[0];

  if (!has('slat_wall') && slatRun && slatRun.a1 - slatRun.a0 > 1.5) {
    const a0 = slatRun.a0 + 0.25, a1 = slatRun.a1 - 0.25;
    out.push({ type: 'slat_wall', rect: mk(a0, a1, slatRun.face - 0.075, slatRun.face), face: faceDir(+1), text: 'LAVA',
      z: bqAlong(slatRun.face, +1) ? 1.0 : 0.9, h: M.ceilH - 0.16, text_at: entAtHigh ? 0.74 : 0.26, src: 'auto' });
  }
  if (!has('poster') && runsB.length) {
    // posters near the kitchen end, clear of tall equipment
    const freeRuns = [];
    for (const r of runsB) {
      let segs = [[r.a0 + 0.2, r.a1 - 0.2]];
      for (const e of tall) {
        const near = ax === 'x' ? Math.min(Math.abs(e.rect[1] - r.face), Math.abs(e.rect[3] - r.face)) : Math.min(Math.abs(e.rect[0] - r.face), Math.abs(e.rect[2] - r.face));
        if (near > 0.6) continue;
        const ea = ax === 'x' ? [e.rect[0] - 0.2, e.rect[2] + 0.2] : [e.rect[1] - 0.2, e.rect[3] + 0.2];
        segs = segs.flatMap(s => (ea[1] <= s[0] || ea[0] >= s[1]) ? [s] : [[s[0], ea[0]], [ea[1], s[1]]]);
      }
      for (const s of segs) if (s[1] - s[0] > 2.6) freeRuns.push({ a0: s[0], a1: s[1], face: r.face });
    }
    freeRuns.sort((p, q) => entAtHigh ? p.a0 - q.a0 : q.a1 - p.a1);
    const run = freeRuns[0];
    if (run) {
      const W = 0.74, gap = 0.16, total = 3 * W + 2 * gap;
      let start = entAtHigh ? run.a0 + 0.35 : run.a1 - 0.35 - total;
      start = clamp(start, run.a0, run.a1 - total);
      const texts = entAtHigh ? ['vaca', 'GOOD MEAT|GOOD PEOPLE', 'cerdo'] : ['cerdo', 'GOOD MEAT|GOOD PEOPLE', 'vaca'];
      texts.forEach((t, i) => out.push({ type: 'poster', rect: mk(start + i * (W + gap), start + i * (W + gap) + W, run.face, run.face + 0.03), face: faceDir(-1), text: t, h: 1.72, size: 1.0, src: 'auto' }));
    }
  }
  if (!has('sconce')) {
    for (const r of runsB) {
      const L = r.a1 - r.a0; const n = Math.max(1, Math.round(L / 2.3)); const step = L / n;
      for (let i = 0; i < n; i++) { const a = r.a0 + step * (i + 0.5); if (a - r.a0 < 0.4 || r.a1 - a < 0.4) continue; out.push({ type: 'sconce', rect: mk(a - 0.08, a + 0.08, r.face, r.face + 0.3), face: faceDir(-1), h: 2.2, src: 'auto' }); }

  }
  const PI = M.partInfo;
  if (!has('sign') && PI) {
    const span = PI.spans.slice().sort((p, q) => (q[1] - q[0]) - (p[1] - p[0]))[0] || [PI.a0, PI.a1];
    const c = (span[0] + span[1]) / 2, L = Math.min(span[1] - span[0] - 0.3, 3.2);
    const [dx, dy] = DIRV[PI.face];

    const rect = PI.along === 'y' ? [Math.min(f, f + dx * 0.06), c - L / 2, Math.max(f, f + dx * 0.06), c + L / 2] : [c - L / 2, Math.min(f, f + dy * 0.06), c + L / 2, Math.max(f, f + dy * 0.06)];
    out.push({ type: 'sign', rect, face: PI.face, text: 'LAVA', h: (PI.glassTop + M.ceilH) / 2, size: clamp((M.ceilH - PI.glassTop) * 0.62, 0.22, 0.56), src: 'auto' });
  }
  if (!has('pendant')) {
    if (PI) {
      let sp = PI.passes.length ? PI.passes : [PI.spans.slice().sort((p, q) => (q[1] - q[0]) - (p[1] - p[0]))[0] || [PI.a0, PI.a1]];
      const pass = M.byKey('pass').find(e => rDist(e.rect, PI.rect) < 0.5);
      if (pass) { const pa = PI.along === 'y' ? [pass.rect[1], pass.rect[3]] : [pass.rect[0], pass.rect[2]]; sp = [[Math.max(pa[0], PI.a0), Math.min(pa[1], PI.a1)]]; }
      const [dx, dy] = DIRV[PI.face];
      const k = PI.along === 'y' ? (dx > 0 ? PI.t0 - 0.4 : PI.t1 + 0.4) : (dy > 0 ? PI.t0 - 0.4 : PI.t1 + 0.4);

        const L = s[1] - s[0], n = clamp(Math.round(L / 0.75), 1, 6), step = L / n;
        for (let i = 0; i < n; i++) { const a = s[0] + step * (i + 0.5); const p = PI.along === 'y' ? [k, a] : [a, k]; out.push({ type: 'pendant', rect: [p[0] - 0.12, p[1] - 0.12, p[0] + 0.12, p[1] + 0.12], face: PI.face, h: 1.95, style: 'dome', src: 'auto' }); }

    if (slatRun) {

    if (span) {
      const L = span[1] - span[0];
      const mkp = (a0, a1) => PI.along === 'y' ? [PI.t0, a0, PI.t1, a1] : [a0, PI.t0, a1, PI.t1];
      const top = PI.base_h - 0.12;
      if (L >= 2.2) {

}

/* ============================ tour ============================ */
function viewpoint(M, rect, front, opt = {}) {
  const cx = rcx(rect), cy = rcy(rect);
  const base = front ? [DIRV[front]] : [[0, 1], [0, -1], [1, 0], [-1, 0]];
  const dists = opt.dists || [1.8, 2.2, 1.5, 2.7, 1.2, 3.2, 0.95];
  const rots = [0, 0.45, -0.45, 0.85, -0.85, 1.2, -1.2];
  for (const strict of [true, false]) {
    for (const dist of dists) for (const rot of rots) for (const b of base) {
      const dx = b[0] * Math.cos(rot) - b[1] * Math.sin(rot), dy = b[0] * Math.sin(rot) + b[1] * Math.cos(rot);
      const tx = Math.abs(dx) > 1e-6 ? (rw(rect) / 2) / Math.abs(dx) : Infinity, ty = Math.abs(dy) > 1e-6 ? (rh(rect) / 2) / Math.abs(dy) : Infinity;
      const te = Math.min(tx, ty);
      const p = [cx + dx * (te + dist), cy + dy * (te + dist)];
      if (!M.isWalk(p[0], p[1], 0.27)) continue;
      if (!M.seeLine(p, [cx, cy], rgrow(rect, 0.06))) continue;
      if (strict) { // nothing tall in between
        const L = Math.hypot(cx - p[0], cy - p[1]); let ok = true;
        for (let s = 0.3; s < L - 0.1 && ok; s += 0.1) {
          const x = lerp(p[0], cx, s / L), y = lerp(p[1], cy, s / L);
          if (x >= rect[0] - 0.05 && x <= rect[2] + 0.05 && y >= rect[1] - 0.05 && y <= rect[3] + 0.05) break;
          if (M.equip.some(e => !e.overhead && e.h > 1.3 && x >= e.rect[0] && x <= e.rect[2] && y >= e.rect[1] && y <= e.rect[3])) ok = false;
        }
        if (!ok) continue;
      }
      return p;
    }
  }
  return M.snap(cx, cy, 0.27, 5) || [cx, cy];
}

function segsCross(a, b) {
  const ccw = (p, q, r) => (r[1] - p[1]) * (q[0] - p[0]) - (q[1] - p[1]) * (r[0] - p[0]);
  for (let i = 1; i < a.length; i++) for (let j = 1; j < b.length; j++) {
    const p1 = a[i - 1], p2 = a[i], q1 = b[j - 1], q2 = b[j];
    const d1 = ccw(q1, q2, p1), d2 = ccw(q1, q2, p2), d3 = ccw(p1, p2, q1), d4 = ccw(p1, p2, q2);
    if (((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0))) return true;
  }
  return false;
}

function buildStops(M) {
  const custom = arr(LAY.tour).filter(s => s && typeof s === 'object' && pt(s.pos));
  if (custom.length) {

      const look = pt(s.look) || [pos[0] - 1, pos[1]];

      flags: [FLAGS.SITE] });
  }
  // 3 Barra / Caja / Pase

        text: `Barra de ${fmt(Math.max(rw(bar.rect), rh(bar.rect)), 2)} m con caja${pos_ ? ' (POS)' : ''} y bebidas${pass ? `; el pase de ${fmt(Math.max(rw(pass.rect), rh(pass.rect)), 2)} m conecta la línea caliente con el salón para que los platos salgan sin que el equipo de cocina cruce las mesas` : ''}.`,
        flags: tb([bar, pass, pos_]) });
    }
  }
  // 4 Show kitchen
  if (parr) {
    const f = itemFront(M, parr);
    const pos = viewpoint(M, parr.rect, f, { dists: [Math.max(1.4, parr.clear + 0.25), 1.9, 1.2, 2.4] });
    const L = Math.max(rw(parr.rect), rh(parr.rect));

      text: `Parrilla argentina de ${fmt(L, 2)} m a leña y carbón, con brasero y parrillas regulables, a la vista del salón a través del vidrio.${hoodL ? ` Campana de ${fmt(hoodL, 2)} m sobre toda la línea caliente.` : ''}`,
      flags: [FLAGS.EXTRACTION, ...tb([parr])] });

    }

    S.push({ id: 'cocina', title: 'Cocina caliente', pos, look, lookH: 1.0,
      text: `Línea caliente de ${fmt(run, 2)} m bajo una sola campana: ${names.join(', ')}.${isFinite(aisleM) ? ` Pasillo de trabajo de ${fmt(aisleM, 2)} m frente a la línea.` : ''}`,
      flags: [FLAGS.EXTRACTION, ...tb(hot)] });
  }
  // 6 Back of house (prep + frío)
  {
    const t = M.one('fridge_2d') || M.one('freezer_1d') || M.one('mesa_1') || M.one('mesa_2');
    if (t) {
      const pos = viewpoint(M, t.rect, itemFront(M, t), { dists: [1.6, 2.0, 1.3, 2.5, 1.0] });
      const clean = M.routes.find(r => r.kind === 'clean');
      const cold = ['fridge_2d', 'freezer_1d'].filter(k => M.one(k)).length, prep = ['mesa_1', 'mesa_2', 'mesa_opt'].filter(k => M.one(k)).length;
      S.push({ id: 'boh', title: 'Back of house · prep + frío', pos, look: [rcx(t.rect), rcy(t.rect)], lookH: 1.1,
        text: `${cold ? `${cold === 2 ? 'Refrigerador de 2 puertas y congelador' : 'Refrigeración'} junto a ` : ''}${prep} mesa${prep === 1 ? '' : 's'} de trabajo inox${M.one('shelf_4') ? ' y estantería de 4 niveles' : ''}. Flujo limpio: frío → preparación → línea → pase${clean ? ` (${fmt(clean.len, 1)} m)` : ''}.`,
        flags: tb([M.one('fridge_2d'), M.one('freezer_1d'), M.one('mesa_1'), M.one('mesa_2'), M.one('shelf_4')]) });
    }
  }
  // 7 Lavado

        flags: tb([s, M.one('mop_sink')]) });
    }
  }
  // 8 Smoker
  {
    const s = M.one('smoker');
    if (s) {
      const pos = viewpoint(M, s.rect, itemFront(M, s), { dists: [1.6, 2.0, 1.3, 2.5, 1.0] });

        text: `Smoker de combustible sólido (${fmt(rw(s.rect), 2)} × ${fmt(rh(s.rect), 2)} m) con chimenea propia${fuel ? `, a ${fmt(rDist(s.rect, fuel.rect), 2)} m del almacén de leña y carbón` : ''}.`,

        flags: tb([d]) });
    }
  }

}

/* ============================ metrics ============================ */
function computeMetrics(M) {
  const G = M.grid;
  // clearance field including chairs (the walk grid ignores chairs)
  const blk = G.block.slice(); for (const c of M.chairs) G.paint(blk, c.rect);
  const fr = new Uint8Array(G.n); for (let k = 0; k < G.n; k++) fr[k] = G.inside[k] && !blk[k] ? 1 : 0;
  const d2 = edt2(fr, G.nx, G.ny);
  const clrAt = (x, y) => { const i = G.ix(x), j = G.iy(y); if (!G.ok(i, j)) return 0; const k = j * G.nx + i; return fr[k] ? Math.max(0, Math.sqrt(d2[k]) * G.cell - G.cell / 2) : 0; };
  const routeW = r => {
    let L = 0; const segs = [];
    for (let k = 1; k < r.pts.length; k++) { const a = r.pts[k - 1], b = r.pts[k], l = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push([a, b, l]); L += l; }
    let w = Infinity, at = null, s = 0;
    for (const [a, b, l] of segs) {
      for (let d = 0; d <= l; d += 0.05) {
        const tot = s + d; if (tot < 0.35 || tot > L - 0.35) continue;
        const x = lerp(a[0], b[0], d / l), y = lerp(a[1], b[1], d / l);
        const c = 2 * clrAt(x, y); if (c < w) { w = c; at = [x, y]; }
      }
      s += l;
    }
    return { w: isFinite(w) ? w : null, at };
  };
  const zones = M.zones.map(z => ({ id: z.id, name: z.name, area: z.area, color: z.color }));

function importPlanSVG(text) {
  try {
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const root = doc.documentElement;
    if (!root || root.nodeName.toLowerCase() !== 'svg' || doc.querySelector('parsererror')) return null;
    root.querySelectorAll('script,foreignObject').forEach(n => n.remove());
    root.querySelectorAll('*').forEach(n => { for (const a of Array.from(n.attributes)) if (/^on/i.test(a.name) || (/href$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name); });
    const svg = document.importNode(root, true);
    let vb = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
    if (vb.length !== 4 || vb.some(v => !isFinite(v))) {
      const w = parseFloat(svg.getAttribute('width')) || 1000, h = parseFloat(svg.getAttribute('height')) || 700;
      vb = [0, 0, w, h];
    }
    svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.setAttribute('class', 'plan-root'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Plano del proyecto (plan/lava_plan.svg)');
    return { svg, bbox: [vb[0], vb[1], vb[0] + vb[2], vb[1] + vb[3]] };
  } catch (e) { console.warn('LAVA: plan SVG ilegible', e); return null; }
}

class PanZoom {
  constructor(wrap) {
    this.wrap = wrap; this.svg = null; this.bbox = [0, 0, 1, 1]; this.v = { cx: 0.5, cy: 0.5, s: 0.01 };

    wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up); wrap.addEventListener('pointerleave', up);
    wrap.addEventListener('wheel', e => { e.preventDefault(); const f = Math.exp(clamp(e.deltaY, -120, 120) * 0.0022); this.zoomAt(e.offsetX, e.offsetY, f); }, { passive: false });

      const k = e.key, st = 40 * this.v.s;

    this.v = { cx: (b[0] + b[2]) / 2, cy: (b[1] + b[3]) / 2, s: Math.max(rw(b) / w, rh(b) / h) * 1.02 };

/* ---------- LΛVΛ glyphs (cap height 1, y up) ---------- */
const GLYPHS = {
  L: { w: 0.62, p: [[0, 0], [0.62, 0], [0.62, 0.2], [0.2, 0.2], [0.2, 1], [0, 1]] },
  A: { w: 0.9, p: [[0, 0], [0.21, 0], [0.45, 0.615], [0.69, 0], [0.9, 0], [0.51, 1], [0.39, 1]] },
  V: { w: 0.9, p: [[0.39, 0], [0.51, 0], [0.9, 1], [0.69, 1], [0.45, 0.385], [0.21, 1], [0, 1]] },
};
function wordGlyphs(text, gap = 0.3) {
  const out = []; let x = 0;
  for (const ch of String(text || 'LAVA').toUpperCase()) {
    const key = ch === 'Λ' ? 'A' : ch;
    const g = GLYPHS[key];
    if (!g) { x += 0.5; continue; }
    out.push(g.p.map(([a, b]) => [a + x, b])); x += g.w + gap;
  }
  return { polys: out, width: Math.max(0.01, x - gap) };
}
function drawWord(ctx, text, cx, cy, H, fill) {
  const { polys, width } = wordGlyphs(text);
  ctx.fillStyle = fill;
  for (const p of polys) { ctx.beginPath(); p.forEach(([a, b], i) => { const X = cx + (a - width / 2) * H, Y = cy - (b - 0.5) * H; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); ctx.fill(); }
}

    const X = p.getX(i), Y = p.getY(i), Z = p.getZ(i);

    else if (ax >= az) uv.setXY(i, nx > 0 ? -Z : Z, Y);

  const s = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(24, 6, 10), basic({ color: 0x120d0a, side: THREE.BackSide })); room.position.y = 2; s.add(room);

/* ---- 13_walk.js ---- */
/* ===================================================================================
   13 walk: first-person camera, keyboard / drag / wheel / joystick, 2D collision
   (circle vs rects + premises edges, slides along obstacles).
   =================================================================================== */

const EYE = 1.6, RADIUS = 0.24;
const WALK = { x: 0, y: 0, yaw: Math.PI, pitch: -0.03, keys: new Set(), joy: { x: 0, y: 0, active: false }, drag: null, speed: 1.55,
  lastInput: 0, moving: false };

function collide(x, y, r = RADIUS) {
  const M = MODEL;
  for (let it = 0; it < 4; it++) {
    let moved = false;
    for (const c of M.colliders) {
      if (x < c[0] - r || x > c[2] + r || y < c[1] - r || y > c[3] + r) continue;
      const qx = clamp(x, c[0], c[2]), qy = clamp(y, c[1], c[3]);
      const dx = x - qx, dy = y - qy, d = Math.hypot(dx, dy);
      if (d >= r) continue;
      if (d > 1e-7) { x = qx + dx / d * r; y = qy + dy / d * r; }
      else { const L = x - c[0], R = c[2] - x, T = y - c[1], Bm = c[3] - y, m = Math.min(L, R, T, Bm); if (m === L) x = c[0] - r; else if (m === R) x = c[2] + r; else if (m === T) y = c[1] - r; else y = c[3] + r; }

    }
    for (const s of M.segs) {

      const t = clamp(((x - s[0]) * ex + (y - s[1]) * ey) / L2, 0, 1), qx = s[0] + ex * t, qy = s[1] + ey * t;
      const dx = x - qx, dy = y - qy, d = Math.hypot(dx, dy);

function tryMove(dx, dy) {
  const M = MODEL;
  const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 0.08));
  let x = WALK.x, y = WALK.y;
  for (let i = 0; i < steps; i++) {
    const [nx, ny] = collide(x + dx / steps, y + dy / steps);
    if (!M.isInside(nx, ny)) break;
    x = nx; y = ny;

}
function setView(x, y, yaw, pitch) { WALK.x = x; WALK.y = y; if (yaw != null) WALK.yaw = yaw; if (pitch != null) WALK.pitch = pitch; }
function lookAtPlan(px, py, lx, ly, lh = 1.35) {
  const yaw = Math.atan2(ly - py, lx - px), d = Math.hypot(lx - px, ly - py) || 1;

}
function applyWalkCamera(cam) {
  const cp = Math.cos(WALK.pitch);

}
function userInput() { WALK.lastInput = performance.now(); if (typeof cancelTourMotion === 'function') cancelTourMotion(); }

function updateWalk(dt) {
  let f = 0, s = 0, turn = 0;
  const k = WALK.keys;
  if (k.has('KeyW') || k.has('ArrowUp')) f += 1;
  if (k.has('KeyS') || k.has('ArrowDown')) f -= 1;
  if (k.has('KeyA')) s -= 1;
  if (k.has('KeyD')) s += 1;
  if (k.has('ArrowLeft') || k.has('KeyQ')) turn -= 1;
  if (k.has('ArrowRight') || k.has('KeyE')) turn += 1;

function initWalkInput(stage) {
  const keyTarget = window;
  const inRecorrido = () => APP.view === 'recorrido' && !W3.aerial;
  keyTarget.addEventListener('keydown', e => {
    if (APP.view !== 'recorrido') return;

    if (!movement.includes(e.code)) return;

    tryMove(Math.cos(WALK.yaw) * st, Math.sin(WALK.yaw) * st);
  }, { passive: false });

  joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture && joy.setPointerCapture(jid); const r = joy.getBoundingClientRect(); jc = [r.left + r.width / 2, r.top + r.height / 2, r.width / 2]; WALK.joy.active = true; moveJoy(e); userInput(); e.stopPropagation(); });

  joy.addEventListener('pointermove', moveJoy);
  const jend = e => { if (e.pointerId !== jid) return; jid = null; WALK.joy = { x: 0, y: 0, active: false }; knob.style.transform = ''; };
  joy.addEventListener('pointerup', jend); joy.addEventListener('pointercancel', jend);
}

/* ---- 14_tour.js ---- */
/* ===================================================================================
   14 tour: guided stops (layout.tour or generated), smooth path-following camera
   (A* on the walk grid), caption cards, automatic tour.
   =================================================================================== */

const TOUR = { idx: -1, motion: null, auto: false, autoTimer: null };
function portraitBias() { const st = $('#stage'); const a = st && st.clientHeight ? st.clientWidth / st.clientHeight : 1.5; return a < 0.8 ? -0.12 : 0; }

function renderStops() {
  const box = $('#stops'); box.replaceChildren();
  MODEL.stops.forEach((s, i) => {
    box.append(el('button', { class: 'stop', type: 'button', 'data-i': i, 'aria-current': 'false', title: s.title, onclick: () => { stopAuto(); goStop(i); } },
      el('b', null, String(i + 1).padStart(2, '0')), s.title));
  });
  $('#btn-auto').addEventListener('click', () => (TOUR.auto ? stopAuto() : startAuto()));
  $('#cap-x').addEventListener('click', () => { $('#caption').hidden = true; });
  $('#cap-prev').addEventListener('click', () => { stopAuto(); goStop((TOUR.idx - 1 + MODEL.stops.length) % MODEL.stops.length); });
  $('#cap-next').addEventListener('click', () => { stopAuto(); goStop((TOUR.idx + 1) % MODEL.stops.length); });
}
function markStop(i) {
  TOUR.idx = i;
  $$('#stops .stop').forEach((b, k) => b.setAttribute('aria-current', String(k === i)));
  const b = $(`#stops .stop[data-i="${i}"]`);
  if (b && b.scrollIntoView) { const box = $('#stops'); const L = (b.getBoundingClientRect().left - box.getBoundingClientRect().left + box.scrollLeft) - box.clientWidth / 2 + b.clientWidth / 2; box.scrollTo({ left: L, behavior: REDUCED ? 'auto' : 'smooth' }); }
}
function showCaption(i) {
  const s = MODEL.stops[i]; if (!s) return;
  $('#cap-idx').textContent = `${String(i + 1).padStart(2, '0')} / ${String(MODEL.stops.length).padStart(2, '0')}`;
  $('#cap-title').textContent = s.title;
  $('#cap-text').textContent = s.text || '';
  $('#cap-flags').replaceChildren(...(s.flags || []).map(f => el('span', { class: 'flag' + (f === FLAGS.DIM || f === FLAGS.SITE ? ' tbv' : '') }, f)));

  $('#caption').hidden = false;
}

function goStop(i, opts = {}) {
  const s = MODEL.stops[i]; if (!s) return;
  if (W3.aerial) toggleAerial(false);
  markStop(i); showCaption(i);
  const v = lookAtPlan(s.pos[0], s.pos[1], s.look[0], s.look[1], s.lookH);
  moveTo(s.pos, v.yaw, v.pitch + portraitBias(), opts);
  emit('stop', i);
}

/* animate the walker along a path to (pos, yaw, pitch) */
function moveTo(pos, yaw, pitch, { instant = false, onDone = null } = {}) {
  cancelTourMotion(true);
  if (instant || REDUCED) { setView(pos[0], pos[1], yaw, pitch); onDone && onDone(); return; }
  const start = [WALK.x, WALK.y];
  let path = MODEL.findPath(start, pos) || [start, pos];
  if (path.length < 2) path = [start, pos];
  // arc length table
  const L = [0]; for (let i = 1; i < path.length; i++) L.push(L[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));

  const dur = clamp(total / speed, 1.1, 8.5) + 0.6;
  TOUR.motion = { path, L, total, t: 0, dur, yaw0: WALK.yaw, pitch0: WALK.pitch, yaw1: yaw, pitch1: pitch, onDone };

function samplePath(m, s) {

  const a = m.path[i - 1], b = m.path[i], seg = (m.L[i] - m.L[i - 1]) || 1, t = (s - m.L[i - 1]) / seg;
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

  m.t += dt;

  const s = e * m.total;

  WALK.x = px / k.length; WALK.y = py / k.length;

}

    if (!TOUR.auto) return;
    goStop(i, {});
    const wait = () => {
      if (!TOUR.auto) return;
      if (TOUR.motion) { TOUR.autoTimer = setTimeout(wait, 250); return; }
      TOUR.autoTimer = setTimeout(() => { if (TOUR.auto) step((i + 1) % MODEL.stops.length); }, 6500);

    TOUR.autoTimer = setTimeout(wait, 400);
  };

function stopAuto() {
  TOUR.auto = false; clearTimeout(TOUR.autoTimer);
  const b = $('#btn-auto'); if (b) { b.setAttribute('aria-pressed', 'false'); b.innerHTML = '▶ <span class="long">Recorrido </span>automático'; }

const CUT_H = 2.25;

function textSprite(text, sub, color) {

  x.beginPath(); x.moveTo(r, 8); x.arcTo(504, 8, 504, 152, r); x.arcTo(504, 152, 8, 152, r); x.arcTo(8, 152, 8, 8, r); x.arcTo(8, 8, 504, 8, r); x.fill();

  x.fillText(text, 256, sub ? 60 : 80);
  if (sub) { x.fillStyle = '#ece5d8'; x.font = '500 34px Figtree,sans-serif'; x.fillText(sub.length > 26 ? sub.slice(0, 25) + '…' : sub, 256, 116); }

function toggleAerial(force) {
  if (!W3.renderer) return;
  const on = force == null ? !W3.aerial : !!force;
  if (on === !!W3.aerial) return;
  W3.aerial = on;
  const M = MODEL, cam = W3.camera;
  $('#btn-aerial').setAttribute('aria-pressed', String(on));
  $('#layers').hidden = !on;
  $('#joy').hidden = on || !COARSE;
  W3.ceiling.visible = !on;
  W3.glowPoints && (W3.glowPoints.visible = !on);
  for (const k of ['caps', 'labels', 'you']) W3.aer[k].visible = on;
  W3.aer.zones.visible = on && $('#tg-zones').checked;
  W3.aer.routes.visible = on && $('#tg-routes').checked;
  W3.renderer.clippingPlanes = on ? [new THREE.Plane(new THREE.Vector3(0, -1, 0), CUT_H)] : [];
  W3.hemi.intensity = on ? 1.6 : W3.hemiBase;
  if (on) {
    cancelTourMotion(); $('#caption').hidden = true;
    const bb = M.pbb, cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
    const target = V3(cx, cy, 0);
    // fit the premises: portrait screens look along X so the long axis runs vertically
    const portrait = cam.aspect < 0.9, radius = Math.hypot(rw(bb), rh(bb)) / 2;
    const vf = 42 * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * cam.aspect);

    const el = 0.95, dir = portrait ? new THREE.Vector3(Math.cos(el), Math.sin(el), 0.18).normalize() : new THREE.Vector3(0.08, Math.sin(el), Math.cos(el)).normalize();
    const end = target.clone().addScaledVector(dir, dist);
    W3.controls.target.copy(target); W3.controls.enabled = true;
    cam.fov = 42; cam.updateProjectionMatrix();
    if (REDUCED) { cam.position.copy(end); cam.lookAt(target); }
    else { W3.fly = { t: 0, dur: 1.3, from: cam.position.clone(), to: end, lookFrom: V3(WALK.x + Math.cos(WALK.yaw) * 3, WALK.y + Math.sin(WALK.yaw) * 3, EYE), lookTo: target }; }
  } else {
    W3.controls.enabled = false; W3.fly = null;
    setFov();
  }
  emit('aerial', on);
}

const MM = { canvas: null, ctx: null, base: null, scale: 1, ox: 0, oy: 0, w: 0, h: 0, last: 0 };

function initMinimap() {
  const c = $('#mm'); MM.canvas = c; MM.ctx = c.getContext('2d');
  const resize = () => {
    const r = c.getBoundingClientRect(); if (!r.width) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    MM.w = c.width; MM.h = c.height;
    const bb = rgrow(MODEL.pbb, 0.35);
    MM.scale = Math.min(MM.w / rw(bb), MM.h / rh(bb));
    MM.ox = (MM.w - rw(bb) * MM.scale) / 2 - bb[0] * MM.scale; MM.oy = (MM.h - rh(bb) * MM.scale) / 2 - bb[1] * MM.scale;
    drawMinimapBase();
  };
  MM.resize = resize;
  if (window.ResizeObserver) new ResizeObserver(resize).observe(c);
  resize();
  const toPlan = e => { const r = c.getBoundingClientRect(), dpr = MM.w / r.width; return [((e.clientX - r.left) * dpr - MM.ox) / MM.scale, ((e.clientY - r.top) * dpr - MM.oy) / MM.scale]; };

    const s = MODEL.snap(x, y, RADIUS + 0.02, 2.5); if (!s) return;
    stopAuto(); TOUR.motion = null; setView(s[0], s[1]); $('#caption').hidden = true;
  });

  if (matchMedia('(max-width:760px)').matches) mm.classList.add('collapsed');
  btn.addEventListener('click', () => { const col = mm.classList.toggle('collapsed'); btn.setAttribute('aria-expanded', String(!col)); if (!col) resize(); });
}
function mmP(x, y) { return [MM.ox + x * MM.scale, MM.oy + y * MM.scale]; }
function mmRect(ctx, r) { const a = mmP(r[0], r[1]); ctx.rect(a[0], a[1], rw(r) * MM.scale, rh(r) * MM.scale); }
function drawMinimapBase() {
  const M = MODEL, base = mkCanvas(MM.w, MM.h), x = base.getContext('2d');
  x.fillStyle = '#26211d'; x.beginPath(); M.prem.forEach((p, i) => { const q = mmP(p[0], p[1]); i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]); }); x.closePath(); x.fill();
  for (const z of M.zones) { x.fillStyle = z.color; x.globalAlpha = 0.22; x.beginPath(); z.poly.forEach((p, i) => { const q = mmP(p[0], p[1]); i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]); }); x.closePath(); x.fill(); }
  x.globalAlpha = 1;
  x.fillStyle = '#5b544c'; for (const e of M.equip) if (!e.overhead) { x.beginPath(); mmRect(x, e.rect); x.fill(); }
  x.fillStyle = '#4f5a45'; for (const t of [...M.tables, ...M.banquettes]) { x.beginPath(); mmRect(x, t.rect); x.fill(); }

  x.strokeStyle = '#8c8377'; x.lineWidth = 1; x.beginPath(); M.prem.forEach((p, i) => { const q = mmP(p[0], p[1]); i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]); }); x.closePath(); x.stroke();
  const dpr = MM.w / (MM.canvas.getBoundingClientRect().width || MM.w);

  M.stops.forEach((s, i) => { const q = mmP(s.pos[0], s.pos[1]); x.fillStyle = 'rgba(201,160,99,.9)'; x.beginPath(); x.arc(q[0], q[1], 6.5 * dpr, 0, 7); x.fill(); x.fillStyle = '#141210'; x.fillText(String(i + 1), q[0], q[1] + 0.5); });

/* ---------------- picking ---------------- */
const PICK = { hover: null, ray: null, ndc: null, box: null };
function pickAt(e) {
  const cv = W3.renderer.domElement, r = cv.getBoundingClientRect();
  PICK.ndc = PICK.ndc || new THREE.Vector2(); PICK.ray = PICK.ray || new THREE.Raycaster();
  PICK.ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  PICK.ray.setFromCamera(PICK.ndc, W3.camera);
  const ray = PICK.ray.ray, hit = new THREE.Vector3();
  let best = null, bd = Infinity;
  for (const p of W3.picks) if (ray.intersectBox(p.box, hit)) { const d = hit.distanceTo(ray.origin); if (d < bd) { bd = d; best = p; } }
  let occ = Infinity;
  for (const o of W3.occluders) if (ray.intersectBox(o.box, hit)) { const d = hit.distanceTo(ray.origin); if (d < occ) occ = d; }
  let floor = null;
  if (ray.direction.y < -0.02) { const t = -ray.origin.y / ray.direction.y; const fp = ray.origin.clone().addScaledVector(ray.direction, t); if (t < occ && t < bd) floor = [fp.x, fp.z, t]; }
  if (best && bd < occ + 0.05) return { item: best, d: bd };
  return { floor };
}
function hoverPick(e) {
  if (!W3.renderer || APP.view !== 'recorrido' || (performance.now() - (PICK.lastHover || 0)) < 60) return;
  PICK.lastHover = performance.now();
  const res = pickAt(e);
  const stage = $('#stage');
  const it = res.item || null;
  stage.classList.toggle('hovering', !!it);
  setHighlight(it);
}
function setHighlight(p) {
  if (PICK.hover === p) return; PICK.hover = p;
  if (!PICK.box) { PICK.box = new THREE.Box3Helper(new THREE.Box3(), 0xff6a1a); PICK.box.material.depthTest = false; PICK.box.material.transparent = true; PICK.box.material.opacity = 0.85; PICK.box.renderOrder = 30; W3.scene.add(PICK.box); }
  PICK.box.visible = !!p;
  if (p) { PICK.box.box.copy(p.box).expandByScalar(0.015); }
}
function tapAt(e) {
  if (!W3.renderer) return;
  const res = pickAt(e);
  if (res.item) { showInfo(res.item); setHighlight(res.item); return; }
  if (res.floor && !W3.aerial) {
    const [x, y, d] = res.floor; if (d > 18 || !MODEL.isInside(x, y)) return;
    const s = MODEL.snap(x, y, RADIUS + 0.02, 1.2); if (!s) return;
    stopAuto(); $('#info').hidden = true; setHighlight(null);
    moveTo(s, WALK.yaw + angDiff(WALK.yaw, Math.atan2(s[1] - WALK.y, s[0] - WALK.x)) * (Math.hypot(s[0] - WALK.x, s[1] - WALK.y) > 1.2 ? 1 : 0), WALK.pitch);
  }
}
function showInfo(p) {
  const it = p.item, card = $('#info');
  let k = '', title = '', dims = '', flags = [], note = '';
  if (p.kind === 'equipment') {
    const f = frameOf(it.rect, itemFront(MODEL, it));
    k = `${KEY_ES[it.key] || CAT_ES[it.cat] || 'Equipo'} · ${CAT_ES[it.cat] || it.cat}`;
    title = it.label;

function webglOK() {
  try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { return false; }
}
function fail3D(msg) {
  $('#loader').hidden = true;
  $('#fail-msg').textContent = msg;
  $('#fail3d').hidden = false;
  for (const s of ['.rail', '.hud-top', '#minimap', '#joy', '#caption']) { const n = $(s); if (n) n.hidden = true; }
}
function loaderStep(p, msg) { const f = $('#loader-fill'); if (f) f.style.width = Math.round(p * 100) + '%'; if (msg) $('#loader-msg').textContent = msg; return nextFrame(); }

function setFov() {
  const cam = W3.camera; if (!cam || W3.aerial) return;
  const a = cam.aspect || 1;
  // keep >= ~52 deg horizontal on portrait phones
  cam.fov = clamp(Math.max(65, 2 * Math.atan(Math.tan(26 * Math.PI / 180) / a) * 180 / Math.PI), 50, 86);
  cam.updateProjectionMatrix();
}

let STARTED3D = false;
async function start3D() {
  if (STARTED3D) return; STARTED3D = true;
  await loaderStep(0.05, 'Encendiendo la parrilla…');
  if (!webglOK()) { fail3D('Este navegador o dispositivo no puede mostrar gráficos 3D (WebGL desactivado o no disponible). El plano y los datos siguen disponibles.'); return; }
  try {
    THREE = await import('three');
    ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
    ({ mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js'));
  } catch (e) {
    console.warn('LAVA: three.js no disponible', e);
    fail3D('No se pudo cargar el motor 3D (three.js desde cdn.jsdelivr.net). Revisa la conexión y recarga; el plano y los datos siguen disponibles sin conexión.');
    return;
  }
  const stage = $('#stage');
  let renderer;

    renderer = new THREE.WebGLRenderer({ antialias: (window.devicePixelRatio || 1) < 2, powerPreference: 'high-performance', alpha: false });
  } catch (e) { fail3D('No se pudo iniciar WebGL en este dispositivo. El plano y los datos siguen disponibles.'); return; }

  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.setClearColor(0x0b0908, 1);
  W3.maxDpr = Math.min(2, window.devicePixelRatio || 1);
  W3.dpr = W3.maxDpr;
  renderer.setPixelRatio(W3.dpr);
  stage.append(renderer.domElement);
  renderer.domElement.setAttribute('aria-hidden', 'true');
  renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); $('#loader').hidden = false; $('#loader').style.opacity = 1; $('#loader-msg').textContent = 'Se perdió el contexto gráfico; recuperando…'; });
  renderer.domElement.addEventListener('webglcontextrestored', () => { $('#loader').hidden = true; });

  try {
    await loaderStep(0.15, 'Tallando texturas…');
    try { await Promise.race([document.fonts ? document.fonts.load('800 60px "Big Shoulders Display"') : null, sleep(1500)]); } catch (e) { /* fonts optional */ }
    makeTextures(renderer);
    makeMaterials();
    await loaderStep(0.35, 'Levantando muros…');
    const scene = new THREE.Scene(); W3.scene = scene;
    scene.background = new THREE.Color(0x0b0908);
    scene.environment = makeEnvironment(renderer);
    W3.root = new THREE.Group(); scene.add(W3.root);
    W3.ceiling = new THREE.Group(); scene.add(W3.ceiling);
    const B = new Batch(), CB = new Batch(), SB = new Batch();
    buildArchitecture(B, CB);
    buildPartition(B);
    await loaderStep(0.5, 'Montando la cocina…');
    buildEquipment(B, CB, SB);
    buildFurniture(B, SB);
    await loaderStep(0.65, 'Colgando lámparas…');
    buildDecor(B, CB);
    buildCeiling(CB);
    buildLogs();
    B.flush(W3.root); CB.flush(W3.ceiling); SB.flush(W3.root, { renderOrder: 1 });
    buildFlames(scene);
    buildGlowPoints(scene);
    buildLights(scene);
    buildAerialLayers(scene);
    await loaderStep(0.8, 'Encendiendo el fuego…');
    const cam = new THREE.PerspectiveCamera(65, 1, 0.05, 90); W3.camera = cam;
    const controls = new OrbitControls(cam, renderer.domElement);
    controls.enabled = false; controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 3; controls.maxDistance = 45; controls.screenSpacePanning = true;
    W3.controls = controls;
    initWalkInput(stage);
    initMinimap();
    renderStops();
    // initial view: entrance, looking at the show kitchen
    const s0 = MODEL.stops[0];
    if (s0) { const v = lookAtPlan(s0.pos[0], s0.pos[1], s0.look[0], s0.look[1], s0.lookH); setView(s0.pos[0], s0.pos[1], v.yaw, v.pitch + portraitBias()); markStop(0); }
    else { const p = MODEL.snap(MODEL.entrance[0], MODEL.entrance[1]) || MODEL.entrance; setView(p[0], p[1], Math.PI, -0.03); }
    resize3D();
    if (window.ResizeObserver) new ResizeObserver(() => resize3D()).observe(stage); else window.addEventListener('resize', resize3D);
    // warm up (compile) before revealing
