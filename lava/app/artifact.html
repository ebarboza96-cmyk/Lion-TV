<title>Recorrido LAVA</title>
<style>
:root{
  --char:#141210; --steel:#1f1b18; --steel2:#2a2521; --line:#3a332d;
  --ember:#ff6a1a; --ember2:#ff8c47; --brass:#c9a063; --sage:#6d7a60;
  --bone:#ece5d8; --muted:#9b9185; --paper:#f3efe6;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --bar-h:54px; --rail-h:60px; --r:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;background:var(--char);}
body{overflow:hidden;}
.lava{position:relative;height:100%;display:flex;flex-direction:column;background:var(--char);color:var(--bone);
  font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-tap-highlight-color:transparent;}
.lava *,.lava *::before,.lava *::after{box-sizing:border-box;}
.lava button{font:inherit;color:inherit;}
.lava :focus{outline:none;}
.lava :focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:8px;}
.lava [hidden]{display:none !important;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}

/* ---------- top bar ---------- */
.bar{flex:0 0 var(--bar-h);height:var(--bar-h);display:flex;align-items:center;gap:18px;padding:0 16px;
  background:linear-gradient(180deg,#1b1714,#141210);border-bottom:1px solid #2b2521;position:relative;z-index:30;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:0 0 auto;}
.wordmark{display:block;height:21px;width:auto;color:var(--bone);filter:drop-shadow(0 0 10px rgba(255,106,26,.35));align-self:center;}
.tagline{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);white-space:nowrap;}
.tabs{display:flex;gap:4px;background:#0f0d0c;border:1px solid #2d2723;border-radius:999px;padding:3px;margin-left:auto;}
.tab{appearance:none;border:0;background:transparent;padding:7px 15px;border-radius:999px;cursor:pointer;
  font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  transition:background .2s,color .2s;white-space:nowrap;}
.tab:hover{color:var(--bone);}
.tab[aria-selected="true"]{background:var(--ember);color:#1a0e06;}
.meta{font-size:12px;color:var(--muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.meta b{color:var(--bone);font-weight:600;}

main{position:relative;flex:1 1 auto;min-height:0;}
.view{position:absolute;inset:0;overflow:hidden;}

/* ---------- common controls ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;
  border-radius:999px;border:1px solid rgba(236,229,216,.16);background:rgba(20,18,16,.78);color:var(--bone);cursor:pointer;
  font-size:13.5px;font-weight:600;letter-spacing:.01em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background .2s,border-color .2s,color .2s;white-space:nowrap;}
.btn:hover{border-color:rgba(236,229,216,.35);background:rgba(36,31,27,.9);}
.btn[aria-pressed="true"]{background:var(--bone);color:#1a1512;border-color:var(--bone);}
.btn.icon{width:38px;padding:0;font-size:16px;}
.btn.ember{background:var(--ember);color:#1b0d04;border-color:var(--ember);}
.btn.ember:hover{background:var(--ember2);}
.btn svg{width:18px;height:18px;flex:0 0 auto;}
.chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:rgba(20,18,16,.72);
  border:1px solid rgba(236,229,216,.12);font-size:12.5px;color:var(--bone);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--sage);}
.flag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;line-height:1.35;letter-spacing:.02em;color:#ffb68a;
  border:1px solid rgba(255,106,26,.55);background:rgba(255,106,26,.09);border-radius:6px;padding:3px 7px;margin:3px 4px 0 0;}
.flag.tbv{color:#f0d49a;border-color:rgba(201,160,99,.6);background:rgba(201,160,99,.1);}

/* ---------- recorrido ---------- */
.stage{position:absolute;inset:0;touch-action:none;cursor:grab;outline:none;}
.stage.dragging{cursor:grabbing;}
.stage.hovering{cursor:pointer;}
.stage canvas{display:block;width:100%;height:100%;}
.hud-top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:6;}
.hud-top>*{pointer-events:auto;}
.hud-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.where{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layers{position:absolute;right:12px;top:60px;z-index:6;background:rgba(20,18,16,.86);border:1px solid rgba(236,229,216,.14);
  border-radius:var(--r);padding:10px 12px;min-width:210px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.layers h3,.help h3{margin:0 0 6px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer;}
.toggle input{accent-color:var(--ember);width:16px;height:16px;margin:0;}
.legend{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px;color:var(--muted);margin:4px 0 2px 24px;}
.legend svg{width:30px;height:8px;align-self:center;}
.help{position:absolute;right:12px;top:60px;z-index:7;width:min(330px,calc(100% - 24px));background:rgba(20,18,16,.92);
  border:1px solid rgba(236,229,216,.14);border-radius:var(--r);padding:14px 16px;font-size:13px;color:var(--bone);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.help ul{margin:0;padding-left:18px;}
.help li{margin:3px 0;}
.help kbd{font-family:var(--f-mono);font-size:11px;border:1px solid #4a423b;border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--bone);background:#1d1916;}
.card{position:absolute;z-index:8;background:rgba(20,18,16,.9);border:1px solid rgba(236,229,216,.14);border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.caption{left:16px;bottom:calc(var(--rail-h) + var(--safe-b) + 14px);width:min(410px,calc(100% - 32px));padding:14px 16px 12px;
  max-height:calc(100% - var(--rail-h) - 110px);overflow:auto;}
.cap-head{display:flex;align-items:baseline;gap:10px;}
.cap-idx{font-family:var(--f-mono);font-size:11px;color:var(--ember);letter-spacing:.06em;}
.cap-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.07em;text-transform:uppercase;line-height:1.05;}
.cap-text{margin:7px 0 4px;font-size:14px;color:#d9d1c4;}
.cap-nav{display:flex;gap:6px;margin-top:10px;}
.cap-nav .btn{height:32px;font-size:12.5px;padding:0 12px;}
.x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;}
.x:hover{color:var(--bone);background:rgba(255,255,255,.06);}
.info{left:16px;top:60px;width:min(330px,calc(100% - 32px));padding:14px 16px;}
.info .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);}
.info h3{margin:2px 30px 6px 0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;}
.info .dims{font-family:var(--f-mono);font-size:14px;color:var(--bone);}
.info .dims small{color:var(--muted);font-size:11px;}
.info p{margin:6px 0 0;font-size:13px;color:#cfc6b8;}
.minimap{position:absolute;right:16px;bottom:calc(var(--rail-h) + var(--safe-b) + 14px);z-index:6;background:rgba(15,13,12,.84);
  border:1px solid rgba(236,229,216,.14);border-radius:12px;padding:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.minimap canvas{display:block;width:250px;height:180px;cursor:crosshair;touch-action:none;border-radius:8px;}
.minimap .mm-t{position:absolute;left:12px;top:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none;}
.rail{position:absolute;left:0;right:0;bottom:0;height:calc(var(--rail-h) + var(--safe-b));padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:10px;align-items:center;
  background:linear-gradient(0deg,rgba(14,12,11,.95),rgba(14,12,11,.75));border-top:1px solid rgba(236,229,216,.08);z-index:9;}
.stops{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;padding:2px;scroll-behavior:smooth;}
.stops::-webkit-scrollbar{display:none;}
.stop{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 6px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(236,229,216,.14);background:rgba(31,27,24,.9);color:var(--bone);font-size:13px;font-weight:500;white-space:nowrap;}
.stop b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#2d2723;color:var(--brass);font-family:var(--f-mono);font-size:11px;font-weight:500;}
.stop:hover{border-color:rgba(236,229,216,.35);}
.stop[aria-current="true"]{border-color:var(--ember);background:rgba(255,106,26,.14);}
.stop[aria-current="true"] b{background:var(--ember);color:#1b0d04;}
#btn-auto{flex:0 0 auto;}
.joy{position:absolute;left:18px;bottom:calc(var(--rail-h) + var(--safe-b) + 18px);width:118px;height:118px;border-radius:50%;z-index:7;
  background:radial-gradient(circle,rgba(236,229,216,.07),rgba(236,229,216,.02) 70%);border:1px solid rgba(236,229,216,.22);touch-action:none;}
.joy-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(236,229,216,.2);
  border:1px solid rgba(236,229,216,.45);box-shadow:0 4px 14px rgba(0,0,0,.4);}
.joy-label{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.hint{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:6;padding:8px 14px;border-radius:999px;font-size:13px;
  background:rgba(20,18,16,.82);border:1px solid rgba(236,229,216,.14);color:var(--bone);white-space:nowrap;pointer-events:none;transition:opacity .6s;}
.loader{position:absolute;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:16px;background:radial-gradient(ellipse at 50% 60%,#2a1a10 0%,#141210 60%);transition:opacity .7s;}
.loader-mark{color:var(--bone);filter:drop-shadow(0 0 22px rgba(255,106,26,.6));}
.loader-mark svg{display:block;height:54px;width:auto;}
.loader-bar{width:200px;height:3px;border-radius:3px;background:#2c2521;overflow:hidden;}
.loader-bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,var(--ember),#ffc27a);transition:width .3s;}
.loader p{margin:0;font-size:13px;color:var(--muted);letter-spacing:.04em;}
.fail{position:absolute;inset:0;z-index:21;display:grid;place-content:center;padding:24px;background:var(--char);text-align:center;}
.fail h2{font-family:var(--f-display);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px;font-size:26px;}
.fail p{max-width:460px;margin:0 auto 16px;color:#cfc6b8;}
.fail .row{display:flex;gap:10px;justify-content:center;}

/* ---------- plano ---------- */
#view-plano{background:#191613;}
.plan-wrap{position:absolute;inset:0;touch-action:none;cursor:grab;}
.plan-wrap.dragging{cursor:grabbing;}
.plan-wrap svg.plan-root{display:block;width:100%;height:100%;}
.plan-tools{position:absolute;right:12px;top:12px;display:flex;gap:8px;z-index:3;flex-wrap:wrap;justify-content:flex-end;}
.plan-legend{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(20,18,16,.9);border:1px solid rgba(236,229,216,.14);border-radius:12px;
  padding:10px 12px;font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;max-width:calc(100% - 24px);}
.plan-legend h3{grid-column:1/-1;margin:0 0 2px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);}
.sw{width:22px;height:12px;border-radius:3px;align-self:center;}
.plan-note{position:absolute;left:12px;top:12px;z-index:3;}

/* ---------- datos ---------- */
#view-datos{overflow:auto;-webkit-overflow-scrolling:touch;}
.datos{max-width:1080px;margin:0 auto;padding:22px 16px 60px;}
.datos h2{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;}
.datos h3{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:28px 0 10px;}
.datos .lead{color:var(--muted);margin:0 0 6px;max-width:760px;}
.note{border:1px dashed rgba(201,160,99,.5);background:rgba(201,160,99,.07);border-radius:10px;padding:10px 12px;color:#e2d3b5;font-size:13px;margin:14px 0 0;}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;}
.kpi{background:var(--steel);border:1px solid #2d2723;border-radius:12px;padding:12px 14px;}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;color:var(--bone);line-height:1.2;}
.kpi .v small{font-size:13px;color:var(--muted);margin-left:3px;}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px;}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--steel);border-radius:12px;overflow:hidden;}
.tbl th,.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid #2c2622;vertical-align:top;}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:#1a1714;}
.tbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.tbl tr:last-child td{border-bottom:0;}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid #2d2723;}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.list li{background:var(--steel);border:1px solid #2d2723;border-radius:10px;padding:10px 12px;font-size:13.5px;}
.list li .t{color:var(--bone);}
.list li .s{color:var(--muted);font-size:12.5px;margin-top:2px;}
.ok{color:#8fcf8f;} .bad{color:#ff8a6a;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.cols>div{min-width:0;}

/* ---------- responsive ---------- */
.only-phone{display:none !important;}
@media (max-width:760px){
  :root{--bar-h:50px;--rail-h:56px;}
  .bar{gap:10px;padding:0 10px;}
  .wordmark{height:18px;}
  .tagline{display:none;}
  .meta{display:none;}
  .tab{padding:7px 11px;font-size:14px;}
  .cols{grid-template-columns:1fr;}
  .only-phone{display:inline-flex !important;}
  .where{max-width:calc(100vw - 262px);}
  .hud-actions{flex-wrap:nowrap;gap:6px;}
  .hud-top{left:8px;right:8px;top:8px;}
  .minimap{right:10px;bottom:calc(var(--rail-h) + var(--safe-b) + 10px);}
  .minimap.collapsed{display:none;}
  .minimap canvas{width:196px;height:150px;}
  .caption{left:8px;right:8px;width:auto;top:56px;bottom:auto;padding:11px 13px 9px;max-height:44%;}
  .cap-nav{margin-top:8px;}
  .layers{left:8px;right:auto;top:auto;bottom:calc(var(--rail-h) + var(--safe-b) + 10px);min-width:0;}
  .plan-note{display:none;}
  .cap-title{font-size:19px;}
  .cap-text{font-size:13px;line-height:1.4;margin:5px 0 2px;}
  .info{left:8px;right:8px;width:auto;top:56px;}
  .btn{height:36px;font-size:13px;padding:0 12px;}
  .btn.icon{width:36px;}
  .rail{gap:8px;padding-left:8px;padding-right:8px;}
  .stop{height:36px;font-size:12.5px;}
  .long{display:none;}
  .hint{top:auto;bottom:calc(var(--rail-h) + var(--safe-b) + 150px);white-space:normal;width:max-content;max-width:calc(100% - 32px);text-align:center;}
  .datos h2{font-size:25px;}
  .kpi .v{font-size:21px;}
}
@media (max-width:380px){ .tab{padding:6px 9px;font-size:13px;} .wordmark{height:16px;} }
@media (prefers-reduced-motion:reduce){ .lava *{transition:none !important;scroll-behavior:auto !important;} }
</style>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <nav class="tabs" role="tablist" aria-label="Secciones">

      <button class="tab" role="tab" id="tab-plano" aria-controls="view-plano" data-view="plano" aria-selected="false" tabindex="-1">Plano</button>
      <button class="tab" role="tab" id="tab-datos" aria-controls="view-datos" data-view="datos" aria-selected="false" tabindex="-1">Datos</button>

      <div id="loader" class="loader" aria-live="polite"><div class="loader-mark" aria-hidden="true"><svg class="lm" viewBox="0 0 422 100" role="img" aria-label="LAVA"><path fill="currentColor" d="M0 100 L62 100 L62 80 L20 80 L20 0 L0 0ZM92 100 L113 100 L137 38 L161 100 L182 100 L143 0 L131 0ZM251 100 L263 100 L302 0 L281 0 L257 62 L233 0 L212 0ZM332 100 L353 100 L377 38 L401 100 L422 100 L383 0 L371 0Z"/></svg></div><div class="loader-bar"><i id="loader-fill"></i></div><p id="loader-msg">Encendiendo la parrilla…</p></div>
      <div id="fail3d" class="fail" hidden role="alert">
        <div>
          <h2>Recorrido 3D no disponible</h2>
          <p id="fail-msg">Este navegador no puede mostrar gráficos 3D (WebGL).</p>
          <div class="row"><a class="btn ember" href="#plano">Ver plano</a><a class="btn" href="#datos">Ver datos</a></div>
        </div>
      </div>
      <div class="hud-top">
        <div id="where" class="chip where" aria-live="polite"><i></i><span>Entrada</span></div>
        <div class="hud-actions">
          <button id="btn-aerial" class="btn" type="button" aria-pressed="false" title="Vista aérea (V)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Vista aérea</button>
          <button id="btn-map" class="btn icon only-phone" type="button" aria-label="Mostrar u ocultar minimapa" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg></button>
          <button id="btn-help" class="btn icon" type="button" aria-label="Ayuda de controles" aria-expanded="false" aria-controls="help">?</button>
        </div>
      </div>
      <div id="layers" class="layers" hidden>
        <h3>Capas</h3>
        <label class="toggle"><input type="checkbox" id="tg-zones" checked> Zonas A–E</label>
        <label class="toggle"><input type="checkbox" id="tg-routes" checked> Rutas</label>
        <div class="legend" id="route-legend"></div>
      </div>
      <div id="help" class="help" hidden>
        <h3>Cómo moverse</h3>
        <ul id="help-list"></ul>

el norte.","flags":["VERIFY ON SITE"]},{"id":"barra","title":"Bar / POS y pase","pos":[7.15,1.85],"look":[5.7,1.2],"look_h":1.05,"text":"Barra compacta: caja, POS y bebidas. En su extremo sur, el pase caliente: la cocina lo carga desde el pasillo de barra y los meseros retiran desde el salón.","flags":[]},{"id":"parrilla","title":"Show kitchen · parrilla","pos":[7.3,3.05],"look":[3.9,3.1],"look_h":1.3,"text":"La hot line está pegada a la división: parrilla → cocina de 4 quemadores → plancha → 2 freidoras. Los cocineros trabajan de frente al salón; la parrilla queda en el eje de la entrada.","flags":["EXTRACTION / MAKE-UP AIR / FIRE SUPPRESSION TO BE ENGINEERED","DIMENSION TO VERIFY"]},{"id":"cocina","title":"Hot line por dentro","pos":[2.6,4.1],"look":[3.6,1.2],"look_h":1.0,"text":"Entrando por la puerta P-1, la línea queda a la derecha. La parrilla tiene su propia campana y ducto (combustible sólido); freidoras, plancha y cocina van bajo la campana 1 con supresión. Mesa de trabajo con horno en el muro norte. Pasillo de trabajo ≥1.10 m.","flags":["EXTRACTION / MAKE-UP AIR / FIRE SUPPRESSION TO BE ENGINEERED"]},{"id":"bbq","title":"BBQ production","pos":[2.1,2.2],"look":[0.3,1.8],"look_h":1.1,"text":"Pared del fondo: smoker vertical y holding caliente, con la leña del día al lado. Flujo smoker → holding → línea / pase.","flags":["SOLID-FUEL SMOKER - LOCATION / FLUE / FIRE CODE TO BE VALIDATED","DIMENSION TO VERIFY"]},{"id":"lavado","title":"Washing (antiguas PILAS)","pos":[2.7,6.9],"look":[3.8,5.6],"look_h":1.0,"text":"El lavado se queda donde Marna’s tenía las pilas: fregadero de 2 tanques, lavamanos y mop sink sobre los drenajes existentes. La loza sucia entra por P-1 y baja directo, sin tocar el frío.","flags":["VERIFY ON SITE"]},{"id":"coldprep","title":"Cold prep (antigua PASTELERÍA)","pos":[2.1,9.7],"look":[4.1,9.3],"look_h":1.1,"text":"Todo el frío y la preparación fría juntos: refrigerador de 2 puertas, congelador, mesa fría, mesa de trabajo y estanterías. Se conecta con la cocina por el pasillo limpio del muro oeste.","flags":[]},{"id":"servicio","title":"Servicio y delivery","pos":[2.6,10.5],"look":[3.2,11.4],"look_h":1.0,"text":"Puerta de servicio PS-1 (condicional) en la ventana sur para recibir mercadería, leña y retirar pedidos. Si la administración no la aprueba, los repartidores retiran en la recepción de la entrada.","flags":["VERIFY ON SITE"]}],"notes":["Zonificación fijada por el cliente (corrección 2): hot line sobre la división con el salón; mesa de trabajo + horno en muro norte junto a las freidoras; smoker + holding en el muro del fondo (oeste); lavado en PILAS; cold prep en PASTELERÍA.","Nueva división en X = 4.325 (cara cocina): corrimiento 1.97 m respecto de la división de Marna’s (X = 6.298). Limitante: línea caliente de 3.80 m + puerta 0.90 en 4.87 m de fondo, y 1.10 m libres frente a las freidoras hasta la mesa de trabajo del muro norte.","Si el horno es de piso (≈80–90 cm) en lugar de horno de mesa, no cabe junto a la mesa en el muro norte sin invadir el frente de las freidoras: la división tendría que quedar en X ≈ 5.1 (corrimiento ≈1.2 m) o el horno ir al muro oeste.","Extracción: NFPA 96 cap. 14 exige que la parrilla de carbón/leña tenga campana, ducto, ventilador y descarga independientes. Se dibujan 2 campanas contiguas: campana 1 ≈2.30 × 1.00 sobre freidoras, plancha y cocina (con supresión UL 300 y corte de gas) y campana 2 ≈1.55 × 1.10 solo sobre la parrilla (arrestachispas). El smoker lleva chimenea propia. La campana única 3.60 × 0.90 cotizada ya no aplica. Dimensiones, caudales, aire de reposición y supresión: TO BE ENGINEERED.","Freidoras junto a la plancha (no junto a llama abierta): cumple la separación típica de 40 cm respecto de parrilla y quemadores; confirmar con ingeniería.","Parrilla contra la división: base incombustible con cámara de aire y vidrio con resistencia térmica/cortafuego — especificación TO BE ENGINEERED.","Pase: la puerta P-1 es la única conexión cocina/salón (la línea ocupa el resto de la división). Los platos salen por P-1 al pase caliente del extremo sur de la barra (≈2 m).","Smoker: chimenea independiente (no conectar al ducto existente), carga de leña y retiro de cenizas por el frente; leña y cenizas entran/salen por PS-1 (si se aprueba) o por la entrada principal fuera de horario."],"dims":[{"a":[-0.085,-0.564],"b":[4.325,0.0],"off":-0.486,"label":"4.41 cocina","sheets":["A101","A102"]},{"a":[4.325,0.0],"b":[4.475,0.0],"off":-1.05,"label":null,"sheets":["A101","A102"]},{"a":[4.475,0.0],"b":[16.285,0.3],"off":-1.05,"label":"11.81 salón + barra","sheets":["A101","A102"]},{"a":[-0.085,-0.564],"b":[16.285,0.3],"off":-0.886,"label":"16.37 interior","sheets":["A101"]},{"a":[16.285,0.116],"b":[16.285,1.643],"off":0.665,"label":null,"sheets":["A101","A102"]},{"a":[16.285,1.643],"b":[16.285,3.643],"off":0.665,"label":"2.00 entrada","sheets":["A101","A102"]},{"a":[16.285,3.643],"b":[16.285,4.986],"off":0.665,"label":null,"sheets":["A101","A102"]},{"a":[16.285,0.116],"b":[16.285,4.986],"off":1.035,"label":"4.87 interior","sheets":["A101","A102"]},{"a":[3.375,0.116],"b":[3.375,0.516],"off":-0.525,"label":"0.40","sheets":["A101"]},{"a":[3.375,0.516],"b":[3.375,0.916],"off":-0.525,"label":"0.40","sheets":["A101"]},{"a":[3.375,0.916],"b":[3.375,1.616],"off":-0.525,"label":"0.70","sheets":["A101"]},{"a":[3.375,1.616],"b":[3.375,2.416],"off":-0.525,"label":"0.80","sheets":["A101"]},{"a":[3.425,2.416],"b":[3.425,3.916],"off":-0.575,"label":"1.50","sheets":["A101"]},{"a":[3.425,3.966],"b":[3.425,4.986],"off":-0.575,"label":"1.02","sheets":["A101"]},{"a":[-0.085,1.0],"b":[-0.085,2.4],"off":-0.865,"label":"1.40 smoker","sheets":["A101"]},{"a":[-0.085,2.55],"b":[-0.085,3.15],"off":-0.865,"label":"0.60","sheets":["A101"]},{"a":[-0.085,3.4],"b":[-0.085,4.4],"off":-0.865,"label":"1.00 leña","sheets":["A101"]},{"a":[-0.085,5.1],"b":[-0.085,7.9],"off":-0.665,"label":"2.80 almacén seco","sheets":["A101"]},{"a":[0.0,9.55],"b":[0.0,10.75],"off":-0.7 UE / FIRE CODE TO BE VALIDATED."},{"tag":"S2","name":"Holding caliente","cat":"fire","w":0.6,"d":0.75,"h":1.0,"tbv":true,"overhead":false,"note":"Gabinete de mantenimiento en caliente ≈60 × 75 TBV. Flujo smoker → holding → línea/pase."},{"tag":"S3","name":"Leña / carbón (rack metálico)","cat":"storage","w":1.0,"d":0.5,"h":1.2,"tbv":true,"overhead":false,"note":"Almacén de uso diario para smoker y parrilla, separado del smoker por el holding. Distancias a combustibles TO BE VALIDATED."},{"tag":"W1","name":"Fregadero 2 tanques","cat":"wash","w":2.0,"d":0.8,"h":0.9,"tbv":false,"overhead":false,"note":"≈200 × 80 con escurridores. Sobre el drenaje existente de la pila de 3 tanques (WP1)."},{"tag":"W2","name":"Lavamanos","cat":"wash","w":0.33,"d":0.38,"h":0.9,"tbv":false,"overhead":false,"note":"33 × 38. Reutiliza la zona húmeda WP2."},{"tag":"W3","name":"Pileta / mop sink","cat":"wash","w":0.5,"d":0.6,"h":0.45,"tbv":false,"overhead":false,"note":"60 × 50 en la posición exacta de la pila palo de piso existente (WP3)."},{"tag":"W4","name":"Mesa de apoyo / escurrido","cat":"wash","w":1.87,"d":0.6,"h":0.9,"tbv":false,"overhead":false,"note":"187 × 60 (mesa opcional del programa) contra la división existente P1: racks limpios / apoyo."},{"tag":"W6","name":"Basureros con tapa (bajo escurridor sucio)","cat":"wash","w":0.8,"d":0.7,"h":0.7,"tbv":false,"overhead":false,"note":"3 contenedores con tapa y pedal (orgánicos / valorizables / ordinarios) bajo el escurridor norte de W1, donde entra la loza sucia. Retiro diario al cuarto de basura del centro comercial, fuera de horario (VERIFY con la administración)."},{"tag":"W7","name":"Gabinete de químicos","cat":"storage","w":0.33,"d":0.3,"h":1.8,"tbv":false,"overhead":false,"note":"Gabinete cerrado y rotulado para productos de limpieza, lejos de alimentos y loza limpia."},{"tag":"GT-1","name":"Trampa de grasa (bajo fregadero)","cat":"wash","w":0.7,"d":0.7,"h":0.4,"tbv":true,"overhead":false,"note":"Interceptor de grasa accesible para limpieza antes de conectar al drenaje existente; tamaño según CIHSE — TO BE ENGINEERED."},{"tag":"W5","name":"Estante loza limpia","cat":"storage","w":1.2,"d":0.35,"h":1.8,"tbv":false,"overhead":false,"note":"120 × 35, 4 niveles."},{"tag":"A1","name":"Refrigerador 2 puertas","cat":"cold","w":1.45,"d":0.7,"h":2.0,"tbv":false,"overhead":false,"note":"145 × 70 × 200."},{"tag":"A2","name":"Congelador vertical","cat":"cold","w":0.75,"d":0.7,"h":2.0,"tbv":false,"overhead":false,"note":"75 × 70 × 200."},{"tag":"A3","name":"Mesa fría refrigerada","cat":"cold","w":1.8,"d":0.7,"h":0.9,"tbv":false,"overhead":false,"note":"180 × 70."},{"tag":"A7","name":"Esquinero inox (mesada en L)","cat":"prep","w":0.7,"d":0.7,"h":0.9,"tbv":false,"overhead":false,"note":"Cierra la esquina entre A4 y A3 con mesada continua en L (sin rendijas difíciles de limpiar)."},{"tag":"A8","name":"Lavamanos prep fría","cat":"wash","w":0.33,"d":0.38,"h":0.9,"tbv":false,"overhead":false,"note":"Lavamanos exclusivo de la zona fría, con jabón y toallas desechables."},{"tag":"A4","name":"Mesa de trabajo inox (prep fría)","cat":"prep","w":1.2,"d":0.7,"h":0.9,"tbv":false,"overhead":false,"note":"120 × 70 (reducida de 180 para dejar libre la boca del pasillo limpio; ajuste permitido por el cliente)."},{"tag":"A5","name":"Estantería 4 niveles","cat":"storage","w":1.7,"d":0.35,"h":1.8,"tbv":false,"overhead":false,"note":"170 × 35."},{"tag":"A6","name":"Almacén seco (estantería)","cat":"storage","w":2.8,"d":0.45,"h":2.0,"tbv":false,"overhead":false,"note":"280 × 45 a lo largo del pasillo limpio (muro oeste). Estantes a ≥15 cm del piso."},{"tag":"C1","name":"Barra de bebidas","cat":"bar","w":0.68,"d":0.65,"h":1.05,"tbv":false,"overhead":false,"note":"Barra compacta de bebidas con enfriador bajo barra y pileta de barra (extender drenaje existente WP5 ≈1 m — VERIFY)."},{"tag":"C5","name":"Lavamanos de barra","cat":"wash","w":0.33,"d":0.38,"h":0.9,"tbv":false,"overhead":false,"note":"Lavamanos exclusivo del personal de barra, al fondo del pasillo de barra (tramo sin salida)."},{"tag":"L1","name":"Casilleros del personal","cat":"misc","w":1.0,"d":0.45,"h":1.8,"tbv":false,"overhead":false,"note":"Mueble cerrado de 10 casilleros (100 × 45 × 180) fuera de las áreas de alimentos, junto a P-1. El personal usa los servicios sanitarios comunes del centro comercial (autorización escrita: VERIFY)."},{"tag":"C4","name":"Caja accesible (h 0.80)","cat":"bar","w":0.9,"d":0.65,"h":0.8,"tbv":false,"overhead":false,"note":"Tramo de mostrador a 0.80 m de altura, 0.90 m de largo, con espacio libre inferior (Ley 7600, Reglamento art. 148)."},{"tag":"C2","name":"Pase / pickup caliente","cat":"bar","w":0.65,"d":0.65,"h":1.05,"tbv":false,"overhead":false,"note":"Repisa de pase con lámparas de calor: se carga desde el pasillo de barra (lado cocina) y se retira desde el salón."},{"tag":"C3","name":"POS","cat":"bar","w":0.45,"d":0.45,"h":0.9,"tbv":false,"overhead":false,"note":""},{"tag":"D2","name":"Recepción + staging / retiro delivery","cat":"delivery","w":0.75,"d":0.6,"h":1.05,"tbv":false,"overhead":false,"note":"Atril de recepción con repisa para pedidos listos: el repartidor retira en la entrada sin cruzar el salón. Los pedidos se empacan en el pase."}],"intro":"Anteproyecto v3 de **LAVA · Contemporary Fire & BBQ** en el local ex-Marna’s (Terrazas Lindora, centro comercial abierto, Santa Ana). La geometría base son los vectores del PDF de Marna’s (1:50, calibrado con los 16.30 m entre ejes A y C); no se modificaron columnas, escalera, perímetro ni zonas húmedas. Se mantiene la zonificación fijada por el cliente (hot line sobre la división con el salón; BBQ production en el muro del fondo; lavado en PILAS; cold prep en la antigua PASTELERÍA) y se incorporan los ajustes de una revisión normativa preliminar (CFIA/APC, Municipalidad de Santa Ana, Bomberos/NFPA, Ministerio de Salud y Ley 7600). Es un anteproyecto para que un profesional responsable del CFIA lo verifique en sitio, lo ajuste y lo firme: no es todavía un plano constructivo.","sections":[{"title":"3. Zonificación operativa (fijada por el cliente)","paragraphs":["Secuencia desde el salón hacia el fondo: **muro al restaurante → HOT LINE → apoyo (mesa + horno) → muro del fondo (smoker + holding) → PILAS (lavado) → PASTELERÍA (cold prep)**. Lo optimizado dentro de esa lógica: espaciamientos, tamaños de mesa, sentido de puertas, pasillos, posición del pase y la conexión barra–cocina, y el layout del salón."],"table":{"header":["Zona","Ubicación","Contenido (frente × fondo, cm)","Área"],"rows":[["B · HOT LINE / SHOW KITCHEN","Contra la nueva división; a la derecha al entrar a la cocina desde el salón","Parrilla 150×90* (combustible sólido, campana 2 propia ≈155×110) → cocina 4Q 80×80* → plancha 70×80* → freidora 1 40×80* → freidora 2 40×80* (campana 1 ≈230×115 con supresión UL 300). Espacio técnico de 15 cm detrás de la línea a gas. Mesa inox 140×70 + horno eléctrico de mesa (ventless) en el muro norte. Lavamanos 33×38.","≈ 12.6 m²"],["E · BBQ PRODUCTION","Muro oeste (fondo de la cocina)","Smoker vertical ≈140×75* con chimenea propia → holding caliente ≈60×75* → gabinete metálico de leña/carbón 100×50* (provisión de un día). Frente libre 1.00 m.","≈ 8.2 m²"],["W · WASHING","Ubicación existente de PILAS (drenajes WP1–WP3)","Fregadero 2 tanques 200×80 con trampa de grasa y basureros con tapa bajo el escurridor sucio, lavamanos 33×38, mop sink 60×50, mesa de escurrido limpio 187×60, estante loza limpia 120×35, gabinete de químicos. P-2 de cierre automático hacia el pasillo limpio.","≈ 9.6 m²"],["A · COLD PREP","Antigua PASTELERÍA + pasillo limpio del muro oeste","Refrigerador 2P 145×70×200 y congelador 75×70×200 contra el muro este, mesa fría 180×70 + esquinero + mesa inox 120×70 en L, lavamanos, estantería 170×35, almacén seco 280×45.","≈ 18.9 m²"],["C · BAR / POS","Salón, junto a la división (lado norte)","Barra de bebidas 68×65 (h 1.05), caja accesible h 0.80 con POS (90×65), pase caliente 65×65, lavamanos de barra. Solo servicio: sin taburetes.","≈ 5.8 m²"],["D · DINING","Salón","36 asientos: 2 bancas con asientos individuales fijos (8 + 10), 10 mesas de 2 (70×70, unibles) y 4 mesas de 4 (120×70), 18 sillas; 2 mesas accesibles (TN6, TS8); casilleros del personal junto a P-1.","≈ 51.6 m²"]]}},{"title":"4. Corrimiento de la división cocina / salón","paragraphs":["La nueva división (NEW PROPOSED WALL, NW-1) queda con su cara de cocina en X = 4.33 m desde el eje A: **1.97 m más atrás** que la división de Marna’s (X = 6.30). El salón gana ≈ 9.6 m² (1.97 × 4.87 m).","Por qué no más atrás: la hot line mide 3.80 m y, con la puerta P-1 (vano 1.02 m), ocupa los 4.87 m de la división. Detrás de la línea hay que dejar 1.10 m libres frente a las freidoras hasta la mesa del muro norte (140 × 70) y 1.00 m frente al smoker, además del espacio técnico de 15 cm para el gas. Con un horno de piso (en vez de horno de mesa) la división tendría que quedar en X ≈ 5.1.","La división es un muro bajo macizo e incombustible h ≈ 1.00 m con vidrio encima, para ver la parrilla desde el salón (visible desde la entrada, a ≈ 12 m, y desde el 100 % de los asientos). Detrás de la parrilla el vidrio debe ser vitrocerámico (≥680 °C) o llevar pantalla inox con cámara ventilada; en el resto, vidrio de seguridad. Sin leña real ni jardinera en la base: el relieve decorativo es incombustible. Un panel térmico (NW-2) cierra el costado de la parrilla hacia la puerta P-1. Especificación TO BE ENGINEERED."]},{"title":"5. Muros: existentes, a demoler y nuevos","paragraphs":["Lectura hecha sobre el PDF (espesor, trama de mampostería, relación con columnas). Confirmar en sitio con sondeo antes de demoler (instalaciones embebidas, anclajes, rigidizadores)."],"table":{"header":["Muro","Lectura","Acción"],"rows":[["Columnas de concreto (ejes A/B/C – 1/2), envolvente de la columna A1 con ductos (EW-PIL), escalera del edificio","Estructura / ductos del edificio","EXISTING WALL · se mantiene"],["Perímetro: muros norte, oeste, sur del ala, EW-E1 (40 cm, con ducto S3), EW-E2, muro sur del salón","Perimetral","EXISTING WALL · se mantiene"],["IP-KB · división cocina / barra de Marna’s (X = 6.30)","10 cm, sin trama de mampostería, sin columnas → liviana","WALL TO DEMOLISH"],["IP-P0b · tramo cocina / pilas (1.06 m)","10 cm, liviana","WALL TO DEMOLISH (abre el paso P-1 → lavado, 1.86 m)"],["IP-P2 · remate de 0.35 m bajo IP-P3","10 cm, liviana","Recorte parcial (boca del pasillo limpio)"],["IP-P0a, IP-P1, IP-P2, IP-P3","10 cm, livianas","EXISTING WALL · se conservan: separan el flujo limpio del sucio"],["Campana existente de Marna’s 3.80 × 1.10","Equipo existente","A RETIRAR (sellar collarines; el riser solo se reutiliza si la inspección lo aprueba)"],["Ventana de platos existente (D-DISH-old)","Antepecho/mostrador: VERIFY ON SITE","Retirar si existe, para el paso libre de 1.86 m hacia lavado"],["Vano existente pasillo limpio → lavado (D-P1-old, 0.91)","Vano en IP-P1","P-2: puerta nueva de cierre automático (separa limpio/sucio y conserva la ruta de evacuación)"],["NW-1 · muro bajo h 1.00 + vidrio (4.87 m)","Nuevo, incombustible","NEW PROPOSED WALL"],["NW-2 · panel térmico parrilla / puerta (0.90 m)","Nuevo, incombustible, piso a campana","NEW PROPOSED WALL"],["P-1 · puerta de vaivén (vano 1.02, hoja ≈0.96, paso libre ≥0.90) con visor","Nuevo vano en NW-1","NUEVO"],["PS-1 · puerta de servicio 0.90 en la ventana sur del ala","Sustituye parte de GL-W1 + 9.5 cm de EW-S2","CONDICIONAL · VERIFY ON SITE (aprobación de la administración)"]]}},{"title":"6. Flujos","bullets":["**Limpio:** cold prep → pasillo limpio del muro oeste (1.10 m) → hot line y BBQ production.","**BBQ:** smoker → holding → línea / pase, por el frente del muro oeste (1.00 m libre).","**Platos:** línea → puerta P-1 (paso libre ≥0.90) → pase caliente en el extremo sur de la barra (≈ 2 m) → meseros por el pasillo central (1.27–1.28 m).","**Sucio:** salón → P-1 → gira al sur → basureros y fregadero (≈ 1.5 m desde la puerta). La puerta P-2 de cierre automático separa el lavado del pasillo limpio y de cold prep.","**Evacuación del ala:** cold prep → P-2 → franja libre de lavado → P-1 → salón → salida (≈ 22 m, límite 22.86 m sin rociadores): la franja de lavado se mantiene siempre libre.","**Delivery:** pedidos empacados en el pase y entregados en la recepción de la entrada; el repartidor no entra al salón y no hay zona de espera interior.","**Leña / cenizas / basura:** fuera de horario, por PS-1 si se aprueba o por la entrada principal; cenizas en contenedor metálico con tapa a un punto exterior acordado con la administración."]},{"title":"7. Ajustes por la revisión normativa (v3)","paragraphs":["Una revisión preliminar (investigación + medición automática sobre el plano + verificación adversarial) contrastó el test-fit con los requisitos que revisarán el CFIA (APC), la Municipalidad de Santa Ana, Bomberos (RNPCI 2023 + NFPA 101/96/10/17A), el Ministerio de Salud (DE 37308-S, DE 43432-S) y la Ley 7600 (DE 26831-MP). Las citas provienen mayormente de fuentes secundarias (los textos oficiales no se pudieron abrir desde este entorno): el profesional responsable debe confirmarlas. Cambios incorporados:"],"bullets":["Extracción separada: campana 2 solo para la parrilla de combustible sólido (NFPA 96 cap. 14) con ducto vertical propio; campana 1 para la línea a gas con supresión UL 300 y corte de gas; chimenea propia del smoker.","Gas de la red del centro comercial: llave principal fuera del local, solenoide enclavada fuera de la campana, manifold en espacio técnico de 15 cm, detector de fugas.","Capacidad declarada 49 personas (clasificación \u003c50 de NFPA 101): barra solo de servicio, bancas con asientos individuales, sin zona de espera interior.","Puerta de cocina P-1 ampliada a vano 1.02 (paso libre ≥0.90, Ley 7600); P-2 de cierre automático entre pasillo limpio y lavado.","Refrigerador y congelador corridos contra el muro sur (elimina el rincón más lejano de la salida); mesada en L en cold prep (sin rendijas).","Lavamanos exclusivos en cold prep y en la barra; gabinete de químicos; basureros con tapa en el extremo sucio; trampa de grasa.","Casilleros del personal fuera de las áreas de alimentos (junto a P-1); baños de clientes y personal: comunes del centro comercial (autorización escrita pendiente).","Caja accesible a 0.80 m y dos mesas accesibles; pasillo principal 1.27 m (≥1.20).","Extintores: clase K para freidoras y para combustible sólido, ABC en cocina, ala y salón; pulsadores de supresión junto a P-1; señalización y luces de emergencia (lámina A-104).","Nicho de leña real y jardinera eliminados de la base detrás de la parrilla; campana existente de Marna’s a retirar."]},{"title":"8. Método","bullets":["Geometría extraída del PDF vectorial (PyMuPDF), escala verificada: 924.09 pt = 16.30 m → 1:50 exacto en A2. Tolerancia ±2 cm.","Layout generado desde datos (tools/make_layout.py) y validado con tools/validate.py: contención en el local, colisiones, zonas libres frente a equipos, anchos libres por ruta (transformada de distancia, sillas ocupadas), cruce limpio / sucio, cobertura de campana, separación freidoras / llama y línea de vista a la parrilla. Resultado: 0 incumplimientos, 0 avisos.","Láminas A2 1:50 (tools/plan_svg.py) y recorrido 3D (tools/build_app.py) salen del mismo archivo de datos."]}],"verify":["Altura libre bajo losa y pleno sobre cielo (se asumió 3.00 m): con la campana a ≈2.05 m quedan ≈0.35 m; si la losa está a menos de ≈3.4 m hay que reevaluar ductos, campanas y smoker.","Ruta real de los ductos: EXT-1 (riser existente de Marna’s, inspección con video), EXT-2 vertical nuevo sobre la parrilla y chimenea del smoker hasta cubierta (penetraciones de losa y remates).","Red de gas del centro comercial: tipo de gas, presión, capacidad asignada y punto de entrega (tentativo en el muro norte, X ≈ 3.0).","Baños comunes del centro comercial: ubicación, distancia desde el local, capacidad para el aforo (CIHSE Tabla 5.3), baño accesible, horario y autorización escrita para clientes y personal.","Pasillo común frente a la entrada: abierto y a nivel de calle (define que D-ENT es salida), ancho disponible si se invierte el giro de las hojas; umbral ≤0.02 m.","Existencia de rociadores y alarma en el centro comercial.","Ventana de platos existente (D-DISH-old): si tiene antepecho, retirarlo para el paso de 1.86 m.","Espesor y composición de la división de Marna’s (X = 6.30) y de IP-P0b: livianas y sin instalaciones embebidas.","Drenajes existentes de PILAS (WP1–WP3) y WP5 para la barra: diámetro, pendiente y punto para la trampa de grasa.","Fichas técnicas y listado (UL/ETL) de parrilla, smoker, freidoras, cocina, plancha, holding y horno ventless (UL 710B).","Muro oeste y envolvente de ductos junto al smoker: incombustibles y distancias según el listado del equipo.","Ventana sur del ala y muro EW-S2: viabilidad de PS-1 y si el pasillo sur es parte de la salida de la escalera.","Cuarto de basura del centro comercial y punto exterior para cenizas.","Tablero y acometida eléctrica existentes (capacidad para el cuadro de cargas preliminar)."],"risks":["Capacidad al límite: el diseño funciona como ocupación de menos de 50 personas (49 declaradas). Con 50 o más cambia a reunión pública y la salida única deja de cumplir.","Recorrido de evacuación máximo ≈ 22 m frente a 22.86 m sin rociadores: la franja de lavado y P-1 deben quedar siempre libres; PS-1 lo bajaría a ≈ 13 m.","Ductos y chimeneas: si la altura a losa no alcanza o el condominio no aprueba las penetraciones, cambian la extracción de la parrilla y el smoker (alternativa: smoker eléctrico o de pellet).","Parrilla argentina de fabricación local sin listado: requiere aprobación de Bomberos con memoria de materiales, o una parrilla listada.","P-1 es la única conexión cocina / salón y la salida del personal: se cruza con la loza sucia; circulación por la derecha y bandejero junto a la entrada al lavado.","Baños comunes: si Salud no acepta la batería del centro comercial, habría que construir baños propios, lo que reduce asientos y afecta la licencia de licores (mínimo usual 32 asientos).","Leña y carbón: solo la provisión de un día; el grueso fuera del local.","Espacio de terminación limitado: mesa de 140 cm con horno de mesa; mesa de prep fría de 120 × 70.","Sin PS-1, mercadería, leña, basura y cenizas pasan por el salón (solo fuera de horario, con limpieza posterior)."],"flags":["EXTRACTION / MAKE-UP AIR / FIRE SUPPRESSION TO BE ENGINEERED","SOLID-FUEL SMOKER - LOCATION / FLUE / FIRE CODE TO BE VALIDATED","DIMENSION TO VERIFY","VERIFY ON SITE"],"footer":"Anteproyecto generado desde datos (data/existing.json + data/layout.json) y validado con tools/validate.py. Revisión normativa preliminar con fuentes mayormente secundarias. Debe ser verificado en sitio, ajustado y firmado por profesionales responsables del CFIA (arquitectura, mecánica, electricidad) antes de cualquier trámite u obra."},"planSvg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 594.0 420.0\" width=\"594.0mm\" height=\"420.0mm\" font-family=\"Figtree, 'Liberation Sans', Arial, sans-serif\" role=\"img\" aria-label=\"LAVA plano conceptual\">\u003crect width=\"594.0\" height=\"420.0\" fill=\"#ffffff\"/>\u003cdefs>\u003cpattern id=\"hatch-ex\" patternUnits=\"userSpaceOnUse\" width=\"1.2\" height=\"1.2\" patternTransform=\"rotate(45)\">\u003crect width=\"1.2\" height=\"1.2\" fill=\"#a8a8a5\"/>\u003cline x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1.2\" stroke=\"#6e6e6a\" stroke-width=\"0.25\"/>\u003c/pattern>\u003cpattern id=\"hatch-smoker\" patternUnits=\"userSpaceOnUse\" width=\"1.4\" height=\"1.4\" patternTransform=\"rotate(45)\">\u003crect width=\"1.4\" height=\"1.4\" fill=\"#f09461\"/>\u003cline x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1.4\" stroke=\"#6e2508\" stroke-width=\"0.3\"/>\u003c/pattern>\u003cpattern id=\"hatch-demo\" patternUnits=\"userSpaceOnUse\" width=\"1.6\" height=\"1.6\" patternTransform=\"rotate(-45)\">\u003crect width=\"1.6\" height=\"1.6\" fi const DOOR_TYPES = new Set(['door', 'double_acting_door', 'sliding_door', 'service_door', 'opening']);
const HOT_KEYS = ['parrilla', 'cocina_4q', 'plancha', 'freidora_1', 'freidora_2'];

const MODEL = (() => { try { return buildModel(); } catch (e) { console.error('LAVA: no se pudo interpretar layout.json / existing.json', e); return null; } })();

function buildModel() {
  const M = { warnings: [] };
  M.ceilH = clamp(num(EX.ceiling && EX.ceiling.height_assumed, 3.0), 2.4, 6);

    const bb = rs.length ? [Math.min(...rs.map(r => r[0])), Math.min(...rs.map(r => r[1])), Math.max(...rs.map(r => r[2])), Math.max(...rs.map(r => r[3]))] : [0, 0, 10, 5];

  M.shafts = arr(EX.shafts).map(s => ({ id: str(s && s.id), rect: nrect(s && s.rect), note: str(s && s.note) })).filter(s => s.rect);
  M.glazing = arr(EX.glazing).map(g => ({ id: str(g && g.id), kind: str(g && g.kind, 'window'), rect: nrect(g && g.rect), note: str(g && g.note) })).filter(g => g.rect);

  M.doors = arr(EX.doors).filter(d => d && d.kind !== 'context' && Array.isArray(d.opening) && d.opening.length >= 4).map(d => {

    id: str(o.id, 'OP' + (i + 1)), type: str(o.type, 'opening'), rect: nrect(o.rect), label: str(o.label), width: num(o.width, null),

  })).filter(w => w.rect);
  for (const w of M.newWalls) {
    M.wallsSolid.push(w.rect);
    let pieces = [w.rect];
    for (const o of doorOps) pieces = pieces.flatMap(q => rSub(q, o.rect));
    for (const q of pieces) M.walls.push({ id: w.id, rect: q, src: 'new', kind: 'new', type: w.type, h: w.h, base_h: w.base_h, role: w.role, parent: w });
  }

    const r = nrect(e.rect); if (!r) return null;
    const key = str(e.key);

    table: str(c.table), facing: normDir(c.facing) })).filter(c => c.rect);

    const pts = arr(r.pts).map(pt).filter(Boolean); if (pts.length < 2) return null;
    let len = 0; for (let k = 1; k < pts.length; k++) len += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
    return { id: str(r.id, 'R' + (i + 1)), kind: str(r.kind, 'guest'), label: str(r.label), pts, min_width: num(r.min_width, null), len };
  }).filter(Boolean);
  M.points = {};
  if (LAY.points && typeof LAY.points === 'object') for (const [k, v] of Object.entries(LAY.points)) { const p = pt(v); if (p) M.points[k] = p; }

  /* ---------- colliders (continuous 2D collision) ---------- */

  const eqBlock = M.equip.filter(e => !e.overhead).map(e => e.rect);
  M.colliders = [...M.walls.map(w => w.rect), ...M.columns.map(c => c.rect), ...M.glazing.map(g => g.rect), ...M.shafts.map(s => s.rect),
    ...(M.stair ? [M.stair.rect] : []), ...eqBlock, ...furn];

    const nx = -(dEnt.b[1] - dEnt.a[1]), ny = dEnt.b[0] - dEnt.a[0], L = Math.hypot(nx, ny) || 1;

/* ============================ grid ============================ */
function buildGrid(M) {

    const i0 = Math.max(0, Math.floor((r[0] - G.x0) / cell)), i1 = Math.min(nx - 1, Math.ceil((r[2] - G.x0) / cell) - 1);
    const j0 = Math.max(0, Math.floor((r[1] - G.y0) / cell)), j1 = Math.min(ny - 1, Math.ceil((r[3] - G.y0) / cell) - 1);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) mask[j * nx + i] = 1;
  };

  for (const r of M.wallsSolid) paint(solid, r);
  for (const c of M.columns) paint(solid, c.rect);
  for (const g of M.glazing) paint(solid, g.rect);
  for (const r of M.colliders) paint(block, r);

  const free = new Uint8Array(G.n);

  for (let k = 0; k < G.n; k++) clr[k] = free[k] ? Math.max(0, Math.sqrt(d2[k]) * cell - cell / 2) : 0;

    const L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(L / (cell * 0.7)));
    for (let k = 1; k < n; k++) {

}
